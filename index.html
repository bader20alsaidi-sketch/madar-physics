<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مدار — مكتبة الفيزياء</title>
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0e1a;
    --surface: #131a2c;
    --surface-2: #1a2338;
    --accent: #5b8def;
    --accent-warm: #f2a65a;
    --text-primary: #edf1fa;
    --text-secondary: #8c95ac;
    --border: #232b40;
    --success: #5ecf9c;
    --danger: #e8697f;
  }
  body.light-theme{
    --bg: #f5f7fb;
    --surface: #ffffff;
    --surface-2: #eef1f7;
    --accent: #3b6fd6;
    --accent-warm: #d9822b;
    --text-primary: #17202e;
    --text-secondary: #5a6478;
    --border: #dde3ee;
    --success: #2f9e6e;
    --danger: #d1435a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}

  /* better-accessibility: تركيز واضح للوحة المفاتيح فقط */
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  :focus:not(:focus-visible){ outline:none; }

  /* better-accessibility: احترام تفضيل تقليل الحركة */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.01ms !important;
      scroll-behavior:auto !important;
    }
  }

  /* better-typography: أرقام ثابتة العرض للنسب المتغيّرة */
  .progress-badge-inner, .quiz-progress{
    font-variant-numeric: tabular-nums;
  }
  body{
    background: radial-gradient(ellipse at top, #0f1526 0%, #060810 70%);
    transition: background .2s ease;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    font-family:'Tajawal', sans-serif;
  }
  body.light-theme{
    background: radial-gradient(ellipse at top, #eef2f9 0%, #dde4ef 70%);
  }

  .phone{
    width:390px; height:800px;
    background: var(--bg);
    border-radius:44px;
    border: 10px solid #05070c;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(91,141,239,0.08);
    overflow:hidden;
    position:relative;
    display:flex; flex-direction:column;
    transition: width .2s ease;
  }

  /* على الجوال: يملأ الشاشة بالكامل بدل إطار العرض التجريبي */
  @media (max-width: 520px){
    body{ padding:0; }
    .phone{
      width:100vw; height:100vh; height:100dvh;
      border-radius:0; border:none; box-shadow:none;
    }
  }

  /* على الأجهزة اللوحية والحواسيب: نوسّع الحاوية بدل ترك مساحة فارغة على الجوانب */
  @media (min-width: 521px) and (max-width: 900px){
    .phone{ width:560px; height:85vh; max-height:900px; }
  }
  @media (min-width: 901px){
    .phone{ width:760px; height:88vh; max-height:960px; }
  }
  @media (min-width: 1280px){
    .phone{ width:920px; }
  }

  .topbar{
    padding: calc(22px + env(safe-area-inset-top)) 20px 14px;
    display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0; gap:10px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .orbit-mark{ width:30px; height:30px; position:relative; flex-shrink:0; }
  .orbit-mark svg{ width:100%; height:100%; }
  .orbit-dot{ transform-origin: 15px 15px; animation: orbit 3.6s linear infinite; }
  @keyframes orbit{ to{ transform: rotate(360deg); } }
  .brand-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size:20px; letter-spacing:0.3px;
    color:var(--text-primary);
  }
  .crumb{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-secondary); }
  .icon-btn{
    width:40px; height:40px; border-radius:12px;
    background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-secondary); cursor:pointer;
    transition: color .15s ease, border-color .15s ease, transform .1s ease;
    flex-shrink:0;
    font-size:15px; font-family:inherit;
  }
  .icon-btn:hover{ color:var(--accent); border-color:var(--accent); }
  .icon-btn:active{ transform:scale(0.96); }

  .content{ flex:1; overflow-y:auto; padding: 4px 20px 20px; }
  .content::-webkit-scrollbar{ width:0; }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--accent); margin-bottom:6px;
  }
  .page-title{
    font-family:'Space Grotesk', sans-serif;
    font-size:26px; font-weight:700; color:var(--text-primary);
    margin-bottom:18px; line-height:1.15;
    text-wrap:balance;
  }

  /* grade grid (home) */
  .grade-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px; }
  .grade-tile{
    background:var(--surface); border:1px solid var(--border); border-radius:20px;
    padding:22px 16px; cursor:pointer; text-align:center;
    transition: transform .1s ease, border-color .15s ease;
    position:relative; overflow:hidden;
  }
  .grade-tile:active{ transform: scale(0.96); }
  .grade-tile:hover{ border-color: rgba(91,141,239,0.5); }
  .grade-num{
    font-family:'Space Grotesk'; font-size:40px; font-weight:700;
    color:var(--accent); line-height:1;
  }
  .grade-label{ font-size:13px; color:var(--text-secondary); margin-top:8px; }
  .grade-tile::after{
    content:''; position:absolute; inset:auto -20px -20px auto;
    width:70px; height:70px; border-radius:50%;
    border:1px solid rgba(91,141,239,0.15);
  }

  /* ad banner (tutoring) */
  .promo-card{
    margin-top:22px;
    background: linear-gradient(160deg, rgba(242,166,90,0.12), rgba(91,141,239,0.05));
    border:1px solid rgba(242,166,90,0.3); border-radius:20px; padding:20px;
    position:relative; overflow:hidden;
  }
  .promo-top{ display:flex; align-items:center; margin-bottom:14px; }
  .promo-teacher{ display:flex; align-items:center; gap:14px; }
  .promo-avatar{
    width:72px; height:72px; border-radius:50%; flex-shrink:0;
    object-fit:cover;
    border:3px solid rgba(242,166,90,0.5);
  }
  .promo-social-proof{ font-size:12px; color:var(--accent-warm); margin-top:3px; }
  .promo-icon{
    width:40px; height:40px; border-radius:12px; flex-shrink:0;
    background: rgba(242,166,90,0.18); color:var(--accent-warm);
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .promo-free-note{
    font-size:11.5px; color:var(--success); text-align:center; font-weight:500;
    margin-bottom:12px; padding:7px; background:rgba(94,207,156,0.1); border-radius:10px;
  }
  .promo-title{ font-weight:700; font-size:19px; line-height:1.2; color:var(--text-primary); margin-bottom:5px; }
  .promo-text{ font-size:12.5px; color:var(--text-secondary); margin-bottom:14px; line-height:1.7; }
  .promo-free-vs-paid{
    background: rgba(0,0,0,0.15); border-radius:12px; padding:10px 12px;
    display:flex; flex-direction:column; gap:7px; margin-bottom:14px;
  }
  .promo-fv-row{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-secondary); line-height:1.5; }
  .promo-fv-tag{
    font-size:10px; font-weight:700; padding:2.5px 8px; border-radius:20px; flex-shrink:0;
    font-family:'JetBrains Mono';
  }
  .promo-fv-tag.free{ background: rgba(94,207,156,0.18); color:var(--success); }
  .promo-fv-tag.locked{ background: rgba(232,105,127,0.15); color:var(--danger); }
  .promo-perks{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .promo-perk{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-primary); }
  .promo-perk-check{
    width:18px; height:18px; border-radius:6px; flex-shrink:0;
    background: rgba(94,207,156,0.18); color:var(--success);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;
  }
  .promo-urgency{
    font-size:11px; color:var(--accent-warm); text-align:center;
    margin-bottom:14px; padding:7px; background:rgba(242,166,90,0.08); border-radius:10px;
  }
  .promo-links{ display:flex; flex-direction:column; gap:8px; }
  .promo-link{
    font-size:13px; text-decoration:none; text-align:center;
    padding:11px; border-radius:12px; font-weight:700;
  }
  .promo-link.primary{ background: var(--accent-warm); color:#1a1206; }
  .promo-link.secondary{ background: rgba(242,166,90,0.12); color:var(--accent-warm); border:1px solid rgba(242,166,90,0.3); }

  /* category grid */
  .cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (min-width: 901px){
    .cat-grid{ grid-template-columns:1fr 1fr 1fr; }
  }
  .cat-tile{
    background:var(--surface); border:1px solid var(--border); border-radius:18px;
    padding:18px 14px; cursor:pointer; display:flex; flex-direction:column; gap:10px;
    transition: transform .1s ease, border-color .15s ease;
  }
  .cat-tile:active{ transform: scale(0.96); }
  .cat-tile:hover{ border-color: rgba(91,141,239,0.4); }
  .cat-badge{
    width:38px; height:38px; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono'; font-size:10.5px; font-weight:700;
  }
  .cat-name{ font-weight:700; font-size:13.5px; color:var(--text-primary); }
  .cat-count{ font-family:'JetBrains Mono'; font-size:10.5px; color:var(--text-secondary); }

  /* content cards */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:16px; margin-bottom:12px; display:flex; gap:14px; align-items:flex-start;
    cursor:pointer; transition: transform .1s ease, border-color .15s ease;
  }
  .card:active{ transform: scale(0.98); }
  .card:hover{ border-color: rgba(91,141,239,0.4); }
  .card-icon{
    width:42px; height:42px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; font-family:'JetBrains Mono'; font-size:11px; font-weight:700;
  }
  .card-body{ flex:1; min-width:0; }
  .card-title{ font-weight:700; font-size:15px; color:var(--text-primary); margin-bottom:4px; }
  .card-meta{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .tag{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--text-secondary);
    background:var(--surface-2); padding:2px 8px; border-radius:6px;
  }
  .card-snippet{ font-size:12.5px; color:var(--text-secondary); line-height:1.6; }
  .progress-badge{
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .progress-badge-inner{
    width:30px; height:30px; border-radius:50%; background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono'; font-size:9.5px; font-weight:500; color:var(--text-secondary);
  }

  .empty{ text-align:center; padding: 60px 20px; color:var(--text-secondary); }
  .empty .orbit-mark{ width:56px; height:56px; margin:0 auto 16px; opacity:0.5; }
  .empty p{ font-size:14px; line-height:1.7; }

  .fab{
    position:absolute; left:20px; bottom:calc(26px + env(safe-area-inset-bottom));
    width:52px; height:52px; border-radius:50%;
    background: linear-gradient(135deg, var(--accent), #3a6bd6);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:24px; cursor:pointer;
    box-shadow: 0 10px 30px -6px rgba(91,141,239,0.6);
    border:none; z-index:5;
  }

  .search-input{
    width:100%; padding:14px 16px; border-radius:14px;
    background:var(--surface); border:1px solid var(--border);
    color:var(--text-primary); font-size:14px; margin-bottom:18px;
    font-family:'Tajawal', sans-serif;
  }
  .search-input::placeholder{ color:var(--text-secondary); }
  .search-input:focus{ border-color:var(--accent); }
  .search-input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  .panel{
    position:absolute; inset:0; background:var(--bg);
    display:flex; flex-direction:column; z-index:10;
    transform: translateX(100%); transition: transform .25s ease;
  }
  .panel.open{ transform: translateX(0); }
  .panel-top{ padding:20px; display:flex; align-items:center; gap:14px; border-bottom:1px solid var(--border); }
  .panel-title{ font-family:'Space Grotesk'; font-weight:700; font-size:16px; flex:1; }
  .panel-body{ flex:1; overflow-y:auto; padding:20px; font-size:14.5px; line-height:2; color:var(--text-primary); }
  .panel-body::-webkit-scrollbar{ width:0; }
  .panel-body p{ margin-bottom:14px; }
  .pdf-placeholder, .sim-soon{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; gap:14px; color:var(--text-secondary); text-align:center; padding:30px;
  }

  /* subscription lock screen */
  .lock-screen{ padding-top:20px; text-align:center; }
  .lock-icon{
    width:56px; height:56px; border-radius:16px; margin:0 auto 16px;
    background: rgba(242,166,90,0.14); color:var(--accent-warm);
    display:flex; align-items:center; justify-content:center; font-size:24px;
  }
  .lock-title{ font-family:'Space Grotesk'; font-weight:700; font-size:17px; margin-bottom:10px; }
  .lock-text{ font-size:13px; color:var(--text-secondary); line-height:1.8; margin-bottom:20px; }

  .quiz-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; }
  .quiz-q{ font-weight:700; font-size:15px; margin-bottom:16px; line-height:1.7; }
  .quiz-opt{
    padding:13px 16px; border-radius:12px; background:var(--surface-2);
    border:1px solid var(--border); margin-bottom:10px; cursor:pointer;
    font-size:13.5px; transition: all .15s ease;
  }
  .quiz-opt:hover{ border-color:var(--accent); }
  .quiz-opt.correct{ background: rgba(94,207,156,0.15); border-color:var(--success); color:var(--success); }
  .quiz-opt.wrong{ background: rgba(232,105,127,0.15); border-color:var(--danger); color:var(--danger); }
  .quiz-progress{ font-family:'JetBrains Mono'; font-size:12px; color:var(--text-secondary); margin-bottom:14px; }

  /* short answer flashcard */
  .flash{
    background:var(--surface); border:1px solid var(--border); border-radius:18px;
    padding:26px 20px; min-height:220px; display:flex; flex-direction:column;
    justify-content:center; cursor:pointer; text-align:center;
  }
  .flash-label{ font-family:'JetBrains Mono'; font-size:10.5px; color:var(--accent); letter-spacing:1px; margin-bottom:12px; }
  .flash-text{ font-size:15px; font-weight:600; line-height:1.8; color:var(--text-primary); }
  .flash-hint{ margin-top:16px; font-size:11px; color:var(--text-secondary); }

  /* simulator */
  .sim-wrap{ padding:10px 4px; }
  .sim-canvas-box{
    background:var(--surface); border:1px solid var(--border); border-radius:18px;
    padding:10px; display:flex; align-items:center; justify-content:center; margin-bottom:16px;
  }
  .sim-controls{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; }
  .sim-row{ margin-bottom:14px; }
  .sim-row label{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-secondary); margin-bottom:8px; }
  .sim-row label span{ font-family:'JetBrains Mono'; color:var(--accent); }
  .sim-row input[type=range]{ width:100%; accent-color: var(--accent); }
  .sim-readout{ font-family:'JetBrains Mono'; font-size:12px; color:var(--text-secondary); text-align:center; margin-top:10px; }

  /* اسأل مدار */
  .ask-madar-fab{
    position:absolute; left:20px; bottom:26px; z-index:8;
    display:flex; align-items:center; gap:8px;
    padding:12px 18px; border-radius:26px; border:none; cursor:pointer;
    background: linear-gradient(135deg, var(--accent), #8b5bef);
    color:#fff; font-family:'Tajawal'; font-weight:700; font-size:13.5px;
    box-shadow: 0 12px 30px -8px rgba(139,91,239,0.55);
  }
  .ask-madar-fab-icon{ font-size:15px; }

  .ask-madar-overlay{
    position:absolute; inset:0; background:rgba(6,8,16,0.75); backdrop-filter: blur(3px);
    display:none; align-items:flex-end; z-index:25;
  }
  .ask-madar-overlay.open{ display:flex; }
  .ask-madar-panel{
    width:100%; height:82%; background:var(--surface);
    border-radius:24px 24px 0 0; border:1px solid var(--border); border-bottom:none;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .ask-madar-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 18px 10px;
  }
  .ask-madar-title{ font-family:'Space Grotesk'; font-weight:700; font-size:16px; display:flex; align-items:center; gap:8px; }
  .ask-madar-title-icon{ color:var(--accent); }
  .ask-madar-note{ font-size:11px; color:var(--text-secondary); padding:0 18px 12px; border-bottom:1px solid var(--border); }
  .ask-madar-messages{ flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:12px; }
  .ask-madar-messages::-webkit-scrollbar{ width:0; }
  .ask-msg{ max-width:85%; padding:11px 14px; border-radius:14px; font-size:13.5px; line-height:1.8; white-space:pre-line; }
  .ask-msg.user{ align-self:flex-end; background:var(--accent); color:#fff; border-bottom-left-radius:4px; }
  .ask-msg.bot{ align-self:flex-start; background:var(--surface-2); color:var(--text-primary); border:1px solid var(--border); border-bottom-right-radius:4px; }
  .ask-msg.bot.loading{ color:var(--text-secondary); }
  .ask-madar-input-row{ display:flex; gap:8px; padding:12px 18px; border-top:1px solid var(--border); }
  .ask-madar-input{
    flex:1; padding:12px 14px; border-radius:22px; background:var(--surface-2);
    border:1px solid var(--border); color:var(--text-primary); font-family:'Tajawal'; font-size:13.5px;
  }
  .ask-madar-input:focus{ border-color:var(--accent); }
  .ask-madar-input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .ask-madar-send{
    width:42px; height:42px; border-radius:50%; border:none; cursor:pointer;
    background: var(--accent); color:#fff; font-size:16px; flex-shrink:0;
  }

  .modal-overlay{
    position:absolute; inset:0; background:rgba(6,8,16,0.7); backdrop-filter: blur(3px);
    display:none; align-items:flex-end; z-index:20;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    width:100%; background:var(--surface); border-radius:24px 24px 0 0;
    padding:24px 20px 30px; border:1px solid var(--border); border-bottom:none;
    max-height:90%; overflow-y:auto;
  }
  .modal h3{ font-family:'Space Grotesk'; margin-bottom:16px; font-size:17px; }
  .modal input, .modal textarea, .modal select{
    width:100%; padding:12px 14px; border-radius:12px; background:var(--surface-2);
    border:1px solid var(--border); color:var(--text-primary); margin-bottom:12px;
    font-family:'Tajawal'; font-size:13.5px;
  }
  .modal textarea{ min-height:90px; resize:vertical; }
  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .btn{ flex:1; padding:12px; border-radius:12px; border:none; cursor:pointer; font-family:'Tajawal'; font-weight:700; font-size:13.5px; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-ghost{ background:var(--surface-2); color:var(--text-secondary); }
  .note{ font-size:11px; color:var(--text-secondary); text-align:center; margin-top:14px; line-height:1.6; }
</style>
</head>
<body>

<div class="phone">

  <div class="topbar">
    <button class="icon-btn" id="backBtn" style="display:none;" onclick="goBack()" aria-label="الرجوع للخلف">→</button>
    <div class="brand" id="brandRow" onclick="handleLogoTap()" role="button" tabindex="0" aria-label="مدار" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault(); handleLogoTap();}">
      <div class="orbit-mark">
        <svg viewBox="0 0 30 30" fill="none" aria-hidden="true">
          <circle cx="15" cy="15" r="3" fill="#5b8def"/>
          <ellipse cx="15" cy="15" rx="13" ry="6" stroke="#5b8def" stroke-width="1.4" opacity="0.5"/>
          <g class="orbit-dot"><circle cx="28" cy="15" r="2.4" fill="#f2a65a"/></g>
        </svg>
      </div>
      <div class="brand-name" id="brandText">مدار</div>
    </div>
    <div style="flex:1"></div>

  {id:601, grade:'11', cat:'short', type:'quiz', title:'أسئلة قصيرة: استخدام الأدوات واتّباع التعليمات', lesson:'1-1', free:true,
   questions:[
     {q:'تحتاج إلى قياس قطر سلك رفيع جداً (أقل من 1 سم) بأعلى دقة ممكنة. أي أداة من الجدول تختارها؟', opts:['المسطرة (أصغر تدريج 1mm)','الشريط المتري (أصغر تدريج 1mm)','الميكرومتر (أصغر تدريج 0.01mm)'], correct:2, free:true},
     {q:'صح أم خطأ: الميكرومتر أقل دقة من القدمة ذات الورنية.', opts:['صح','خطأ'], correct:1},
     {q:'أصغر تدريج (أعلى دقة) يمكن قراءته بالقدمة ذات الورنية هو:', opts:['1 mm','0.05 mm','0.01 mm'], correct:1},
     {q:'صح أم خطأ: عند قراءة الميكرومتر، نجمع قيمة التدريج الثابت مع قيمة التدريج الدوار حسابياً (وليس رصفهما بجانب بعض).', opts:['صح','خطأ'], correct:0},
     {q:'طالب قاس نفس الطول 5 مرات فحصل على قراءات متقاربة جداً من بعضها، لكنها جميعاً أكبر من القيمة الحقيقية بسبب عيب في معايرة الجهاز. صف هذه الحالة:', opts:['دقة عالية + ضبط منخفض (خطأ نظامي)','دقة منخفضة + ضبط عالٍ','دقة وضبط عاليان معاً'], correct:0},
     {q:'صح أم خطأ: لتجنّب خطأ اختلاف المنظر (Parallax) عند القراءة، يجب أن تكون عين القارئ في نفس مستوى العلامة على المسطرة تماماً.', opts:['صح','خطأ'], correct:0},
     {q:'ما الخطأ الشائع الذي يقع فيه كثير من الطلاب عند قراءة الميكرومتر؟', opts:['رصف رقمي التدريج الثابت والدوار بجانب بعض بدل جمعهما','ضبط الصفر قبل القياس','استخدام وحدة الملم بدل السنتيمتر'], correct:0},
     {q:'قراءات متكررة تشتّتت حول القيمة الحقيقية بسبب اختلاف زاوية النظر أو تفاوت بشري — أي نوع خطأ هذا؟', opts:['خطأ نظامي، ويُعالج بمعايرة الأداة','خطأ عشوائي، ويُعالج بتكرار القياس وأخذ المتوسط','لا يُصنَّف كخطأ قياس'], correct:1},
   ]},

  {id:1, grade:'11', cat:'summaries', type:'text', title:'قوانين نيوتن للحركة', lesson:'1-4', free:true,
   body:'ينص قانون نيوتن الأول على أن الجسم يبقى ساكناً أو متحركاً بسرعة ثابتة ما لم تؤثر عليه قوة خارجية محصلتها لا تساوي صفراً — وهذا ما يُعرف بمبدأ القصور الذاتي.\n\nالقانون الثاني يربط القوة بالتسارع والكتلة عبر العلاقة ق = ك × ت.\n\nأما القانون الثالث فيوضح أن لكل فعل ردة فعل مساوية له في المقدار ومعاكسة له في الاتجاه.'},

  {id:4, grade:'10', cat:'summaries', type:'text', title:'قانون كولوم والمجال الكهربائي', lesson:'3-1',
   body:'يصف قانون كولوم القوة المتبادلة بين شحنتين نقطيتين، حيث تتناسب هذه القوة طردياً مع حاصل ضرب الشحنتين وعكسياً مع مربع المسافة بينهما.\n\nالمجال الكهربائي عند نقطة معينة هو القوة التي تؤثر بها الشحنة على وحدة شحنة موجبة موضوعة عند تلك النقطة.'},
  {id:5, grade:'12', cat:'explanations', type:'pdf', title:'شرح مبسّط لميكانيكا الكم'},
  {id:6, grade:'12', cat:'summaries', type:'text', title:'النسبية الخاصة لأينشتاين',
   body:'تقوم النظرية على مسلمتين: أن قوانين الفيزياء واحدة في جميع الأطر المرجعية العاطلة، وأن سرعة الضوء في الفراغ ثابتة لجميع المراقبين.\n\nمن هاتين المسلمتين تنتج نتائج مثل تمدد الزمن وتقلص الطول، وتكافؤ الكتلة والطاقة.'},
  {id:7, grade:'9', cat:'summaries', type:'text', title:'مقدمة في القياس والوحدات',
   body:'تعتمد الفيزياء على النظام الدولي للوحدات (SI) لقياس الكميات الأساسية كالطول بالمتر والكتلة بالكيلوغرام والزمن بالثانية.\n\nتُشتق باقي الكميات الفيزيائية من هذه الوحدات الأساسية، مثل السرعة (متر/ثانية) والقوة (نيوتن).'},

   كل طالب يحصل على رمز خاص به من الأستاذ. أضف/احذف رموزاً هنا كما تحتاج.
   ملاحظة أمانية مهمة: بما أن هذا موقع ثابت بدون خادم، هذه الرموز مكتوبة
   داخل كود الصفحة ويمكن لأي شخص تقني رؤيتها عبر "عرض المصدر"، كما لا توجد
   طريقة لمنع طالب من مشاركة رمزه مع غيره أو تتبّع من يستخدم كل رمز.
   هذا حاجز كافٍ عملياً لصف دراسي عادي، لكنه ليس حماية صارمة حقيقية —
   تلك تتطلب خادماً وقاعدة بيانات فعلية. */
const subscriptionCodes = ['PHY-1001','PHY-1002','PHY-1003','PHY-1004','PHY-1005'];

/* ===== Navigation state ===== */
let stack = [{screen:'home'}];
let quizState = {itemId:null, index:0, score:0, answered:false};
let flashState = {itemId:null, index:0, revealed:false};

/* ===== وضع الإدارة (مخفي عن الطلاب) =====
   اضغط شعار "مدار" 5 مرات خلال ثانيتين لإظهار زر الإضافة.
   ملاحظة أمانية: هذا يمنع الطلاب العاديين من الوصول العرضي لإضافة محتوى،
   لكنه ليس حماية حقيقية بما أن كود الصفحة مرئي لأي شخص تقني.
   الحماية الحقيقية تتطلب نظام تسجيل دخول وخادم فعلي. */
const ADMIN_PASSWORD = 'Bb93669399*';
let isAdmin = false;
let tapCount = 0, tapTimer = null;
function handleLogoTap(){
  if(isAdmin) return;
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(()=>{ tapCount = 0; }, 2000);
  if(tapCount >= 5){
    tapCount = 0;
    const pass = prompt('كلمة مرور الإدارة:');
    if(pass === ADMIN_PASSWORD){
      isAdmin = true;
      document.getElementById('addBtn').style.display = 'flex';
    } else if(pass !== null){
      alert('كلمة مرور غير صحيحة');
    }
  }
}

function cur(){ return stack[stack.length-1]; }
function push(s){ stack.push(s); render(); }
function goBack(){ if(stack.length>1){ stack.pop(); render(); } }

function updateTopbar(){
  const backBtn = document.getElementById('backBtn');
  const brandText = document.getElementById('brandText');
  const s = cur();
  if(s.screen==='home'){
    backBtn.style.display='none'; brandText.textContent='مدار';
  } else {
    backBtn.style.display='flex';
    if(s.screen==='units'){ brandText.textContent = 'الصف ' + gradeLabel(s.grade); }
    else if(s.screen==='lessons'){ brandText.textContent = unitDef(s.grade, s.unit).title.split(':')[0]; }
    else if(s.screen==='categories'){
      brandText.textContent = s.lesson ? lessonTitle(s.grade, s.lesson) : 'الصف ' + gradeLabel(s.grade);
    }
    else if(s.screen==='list'){ brandText.textContent = catName(s.cat); }
    else { brandText.textContent = 'مدار'; }
  }
}

function gradeLabel(id){ return grades.find(g=>g.id===id).label; }
function catName(id){ return catDefs.find(c=>c.id===id).name; }
function catDef(id){ return catDefs.find(c=>c.id===id); }
function unitDef(grade, unitId){ return (unitsData[grade]||[]).find(u=>u.id===unitId); }
function lessonTitle(grade, lessonId){
  for(const u of (unitsData[grade]||[])){
    const l = u.lessons.find(l=>l.id===lessonId);
    if(l) return l.title;
  }
  return '';
}

function lessonPage(grade, lessonId){
  for(const u of (unitsData[grade]||[])){
    const l = u.lessons.find(l=>l.id===lessonId);
    if(l && l.page) return l.page;
  }
  return null;
}

function render(){
  updateTopbar();
  const c = document.getElementById('content');
  const s = cur();
  const fab = document.getElementById('askMadarFab');
  if(fab) fab.style.display = s.grade ? 'flex' : 'none';
  if(s.screen==='home') return renderHome(c);
  if(s.screen==='units') return renderUnits(c, s.grade);
  if(s.screen==='lessons') return renderLessons(c, s.grade, s.unit);
  if(s.screen==='categories') return renderCategories(c, s.grade, s.lesson);
  if(s.screen==='list') return renderList(c, s.grade, s.cat, s.lesson);
}

/* ===== UNITS for a grade (from textbook index) ===== */
function renderUnits(c, grade){
  const units = unitsData[grade] || [];
  c.innerHTML = `
    <div class="eyebrow">الصف ${gradeLabel(grade)}</div>
    <div class="page-title">وحدات الكتاب</div>
    ${units.map(u => `
      <div class="card" onclick="push({screen:'lessons', grade:'${grade}', unit:'${u.id}'})" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault(); push({screen:'lessons', grade:'${grade}', unit:'${u.id}'});}">
        <div class="card-icon" style="background:var(--accent)22; color:var(--accent);">${u.lessons.length}</div>
        <div class="card-body">
          <div class="card-title">${u.title}</div>
          <div class="card-snippet">${u.lessons.length} درس</div>
        </div>
      </div>`).join('')}
  `;
}

/* ===== LESSONS within a unit ===== */
function renderLessons(c, grade, unitId){
  const u = unitDef(grade, unitId);
  c.innerHTML = `
    <div class="eyebrow">${gradeLabel(grade)}</div>
    <div class="page-title">${u.title}</div>
    ${u.lessons.map(l => {
      const pct = lessonProgressPercent(grade, l.id);
      return `
      <div class="card" onclick="push({screen:'categories', grade:'${grade}', lesson:'${l.id}'})" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault(); push({screen:'categories', grade:'${grade}', lesson:'${l.id}'});}">
        <div class="card-icon" style="background:var(--accent)22; color:var(--accent);">${l.id}</div>
        <div class="card-body">
          <div class="card-title">${l.title}</div>
          ${l.page ? `<div class="card-snippet">صفحة ${l.page} في كتاب الطالب</div>` : ''}
        </div>
        <div class="progress-badge" style="background: conic-gradient(var(--accent) ${pct}%, var(--border) 0);">
          <div class="progress-badge-inner">${pct}%</div>
        </div>
      </div>`;
    }).join('')}
  `;
}

/* ===== CATEGORIES for a grade (+ optional lesson) ===== */
function renderCategories(c, grade, lesson){
  const pageNum = lesson ? lessonPage(grade, lesson) : null;
  c.innerHTML = `
    <div class="eyebrow">${lesson ? lessonTitle(grade, lesson) : 'الصف ' + gradeLabel(grade)}</div>
    <div class="page-title">اختر القسم</div>
    ${pageNum ? `<div class="tag" style="margin-bottom:16px; display:inline-block;">صفحة ${pageNum} في كتاب الطالب</div>` : ''}
    <div class="cat-grid">
      ${catDefs.map(cd => {
        const count = items.filter(i=>i.grade===grade && i.cat===cd.id && (lesson ? i.lesson===lesson : !i.lesson)).length;
        const lessonParam = lesson ? `, lesson:'${lesson}'` : '';
        return `<div class="cat-tile" onclick="push({screen:'list', grade:'${grade}', cat:'${cd.id}'${lessonParam}})" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault(); push({screen:'list', grade:'${grade}', cat:'${cd.id}'${lessonParam}});}">
          <div class="cat-badge" style="background:${cd.color}22; color:${cd.color};">${cd.badge}</div>
          <div class="cat-name">${cd.name}</div>
          <div class="cat-count">${count} عنصر</div>
        </div>`;
      }).join('')}
    </div>
  `;
}

/* ===== LIST of items for grade + category (+ optional lesson) ===== */
function renderList(c, grade, cat, lesson){
  const filtered = items.filter(i=>i.grade===grade && i.cat===cat && (lesson ? i.lesson===lesson : !i.lesson));
  const cd = catDef(cat);
  c.innerHTML = `
    <div class="eyebrow">${lesson ? lessonTitle(grade, lesson) : gradeLabel(grade)} · ${cd.name}</div>
    <div class="page-title">${cd.name}</div>
    ${filtered.length ? filtered.map(itemCardHTML).join('') : `<div class="empty"><p>لا يوجد محتوى في هذا القسم بعد.<br>اضغط على زر (+) لإضافة أول عنصر.</p></div>`}
  `;
}

function itemCardHTML(item){
  const cd = catDef(item.cat);
  const locked = isLocked(item);
  let snippet = '';
  if(locked) snippet = 'يتطلب الاشتراك مع الأستاذ — اضغط للتفاصيل';
  else if(item.type==='text') snippet = (item.body||'').slice(0,70)+'…';
  else if(item.type==='pdf') snippet = 'ملف PDF مرفق — اضغط للمعاينة';
  else if(item.type==='quizpage') snippet = 'اختبار تفاعلي بتصميم خاص — اضغط لفتحه';
  else if(item.type==='quiz') snippet = item.questions.length + ' سؤال — اضغط لبدء الاختبار';
  else if(item.type==='shortset') snippet = item.qa.length + ' سؤال قصير — اضغط للمراجعة';
  else if(item.type==='sim') snippet = item.sim==='soon' ? 'محاكاة قريباً' : 'محاكاة تفاعلية — اضغط للتجربة';
  else if(item.type==='simlink') snippet = 'محاكاة تفاعلية خارجية' + (item.source ? (' (' + item.source + ')') : '') + ' — اضغط للفتح';
  else if(item.type==='image') snippet = 'ملخص مصوّر — اضغط للمعاينة';
  return `<div class="card" onclick="openItem(${item.id})" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault(); openItem(${item.id});}">
    <div class="card-icon" style="background:${cd.color}22; color:${cd.color};">${locked ? '🔒' : cd.badge}</div>
    <div class="card-body">
      <div class="card-title">${item.title}</div>
      <div class="card-meta"><span class="tag">${cd.name}</span>${item.free ? '<span class="tag" style="color:var(--success);">مجاني</span>' : ''}</div>
      <div class="card-snippet">${snippet}</div>
    </div>
  </div>`;
}

/* ===== Open an item into the sliding panel ===== */
function openItem(id){
  const item = items.find(i=>i.id===id);
  document.getElementById('panelTitle').textContent = item.title;
  const body = document.getElementById('panelBody');

  if(isLocked(item)){
    renderSubscribeScreen(item);
    document.getElementById('panel').classList.add('open');
    return;
  }

  if(item.type!=='quiz' && item.type!=='shortset'){
    markItemComplete(item.id);
  }

  if(item.type==='pdf'){
    if(item.fileUrl){
      body.innerHTML = `
        <div style="margin-bottom:16px;">
          <a class="btn btn-primary" style="display:block; text-decoration:none; text-align:center;" href="${item.fileUrl}" download>تحميل ملف PDF</a>
        </div>
        <iframe src="${item.fileUrl}" style="width:100%; height:70vh; border:1px solid var(--border); border-radius:12px;"></iframe>
      `;
    } else {
      body.innerHTML = `<div class="pdf-placeholder">
        <div style="font-family:'JetBrains Mono'; font-size:13px; color:var(--accent-warm); border:1px solid var(--border); padding:20px 30px; border-radius:14px;">PDF</div>
        <p>لم يُرفق ملف PDF فعلي لهذا العنصر بعد.</p>
      </div>`;
    }
  } else if(item.type==='quizpage'){
    body.innerHTML = `
      <div style="text-align:center; padding:30px 10px;">
        <div style="font-family:'JetBrains Mono'; font-size:13px; color:var(--accent); border:1px solid var(--border); padding:20px 30px; border-radius:14px; display:inline-block; margin-bottom:16px;">EXM</div>
        <p style="color:var(--text-secondary); font-size:13px; margin-bottom:20px; line-height:1.8;">هذا اختبار تفاعلي بتصميمه الخاص الكامل. اضغط الزر لفتحه في صفحة جديدة.</p>
        <a class="btn btn-primary" style="display:block; text-decoration:none; text-align:center; padding:14px;" href="${item.fileUrl}" target="_blank" rel="noopener">فتح الاختبار</a>
      </div>
    `;
  } else if(item.type==='text'){
    body.innerHTML = `
      <div>${item.body.split('\n\n').map(p=>`<p>${p}</p>`).join('')}</div>
      <button class="btn btn-primary" style="width:100%; margin-top:8px;" onclick="downloadText(${item.id})">تحميل كملف نصي</button>
    `;
  } else if(item.type==='quiz'){
    quizState = {itemId:id, index:0, score:0, answered:false};
    renderQuizPanel();
  } else if(item.type==='shortset'){
    flashState = {itemId:id, index:0, revealed:false};
    renderFlashPanel();
  } else if(item.type==='sim'){
    renderSimPanel(item);
  } else if(item.type==='simlink'){
    body.innerHTML = `
      <div style="text-align:center; padding:30px 10px;">
        <div style="font-family:'JetBrains Mono'; font-size:13px; color:var(--success); border:1px solid var(--border); padding:20px 30px; border-radius:14px; display:inline-block; margin-bottom:16px;">SIM</div>
        <p style="color:var(--text-secondary); font-size:13px; margin-bottom:6px; line-height:1.8;">محاكاة تفاعلية من مصدر خارجي موثوق${item.source ? (' — ' + item.source) : ''}. اضغط الزر لفتحها في صفحة جديدة.</p>
        <p style="color:var(--text-secondary); font-size:11.5px; margin-bottom:20px;">قد تظهر بالإنجليزية؛ بعض المحاكاات توفر تبديل اللغة من داخلها.</p>
        <a class="btn btn-primary" style="display:block; text-decoration:none; text-align:center; padding:14px;" href="${item.url}" target="_blank" rel="noopener">فتح المحاكاة</a>
      </div>
    `;
  } else if(item.type==='image'){
    body.innerHTML = `
      <div style="margin-bottom:16px;">
        <a class="btn btn-primary" style="display:block; text-decoration:none; text-align:center;" href="${item.fileUrl}" download>تحميل الصورة</a>
      </div>
      <img src="${item.fileUrl}" style="width:100%; border:1px solid var(--border); border-radius:12px; display:block;">
    `;
  }
  document.getElementById('panel').classList.add('open');
}
function closePanel(){ document.getElementById('panel').classList.remove('open'); }

function renderSubscribeScreen(item){
  const body = document.getElementById('panelBody');
  body.innerHTML = `
    <div class="lock-screen">
      <div class="lock-icon">🔒</div>
      <div class="lock-title">هذا المحتوى للمشتركين فقط</div>
      <p class="lock-text">"${item.title}" جزء من دروس التقوية. اشترك مع الأستاذ بدر السعيدي للحصول على كود يفتح كل المحتوى.</p>
      <input type="text" id="codeInput" class="search-input" placeholder="أدخل كود الاشتراك هنا" style="text-align:center; margin-bottom:10px;">
      <button class="btn btn-primary" style="width:100%; margin-bottom:10px;" onclick="submitCode(${item.id})">تحقق من الكود</button>
      <div id="codeError" style="color:var(--danger); font-size:12.5px; text-align:center; margin-bottom:10px; display:none;">الكود غير صحيح، تأكد منه أو تواصل مع الأستاذ.</div>
      <a href="https://wa.me/96893669399" target="_blank" rel="noopener" class="btn btn-ghost" style="display:block; text-decoration:none; text-align:center;">للاشتراك تواصل عبر واتساب</a>
    </div>
  `;
}

function submitCode(id){
  const input = document.getElementById('codeInput');
  const err = document.getElementById('codeError');
  if(tryUnlock(input.value)){
    openItem(id);
  } else {
    err.style.display = 'block';
  }
}

function downloadText(id){
  const item = items.find(i=>i.id===id);
  const blob = new Blob([item.title + '\n\n' + item.body], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = item.title + '.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ===== Quiz ===== */
function renderQuizPanel(){
  const item = items.find(i=>i.id===quizState.itemId);
  const body = document.getElementById('panelBody');
  if(quizState.index >= item.questions.length){
    markItemComplete(item.id);
    body.innerHTML = `
      <div class="quiz-card" style="text-align:center;">
        <div style="font-family:'Space Grotesk'; font-size:38px; font-weight:700; color:var(--accent); margin-bottom:8px;">${quizState.score}/${item.questions.length}</div>
        <div style="color:var(--text-secondary); font-size:13px; margin-bottom:18px;">إجابات صحيحة</div>
        <button class="btn btn-primary" onclick="quizState={itemId:${item.id}, index:0, score:0, answered:false}; renderQuizPanel();">إعادة الاختبار</button>
      </div>`;
    return;
  }
  const q = item.questions[quizState.index];
  body.innerHTML = `
    <div class="quiz-progress">سؤال ${quizState.index+1} من ${item.questions.length}</div>
    <div class="quiz-card">
      <div class="quiz-q">${q.q}</div>
      ${q.opts.map((opt,i)=>`<div class="quiz-opt" id="qopt${i}" onclick="answerQuiz(${i})">${opt}</div>`).join('')}
    </div>
  `;
}
function answerQuiz(i){
  if(quizState.answered) return;
  quizState.answered = true;
  const item = items.find(it=>it.id===quizState.itemId);
  const q = item.questions[quizState.index];
  document.getElementById('qopt'+q.correct).classList.add('correct');
  if(i!==q.correct) document.getElementById('qopt'+i).classList.add('wrong');
  else quizState.score++;
  setTimeout(()=>{ quizState.index++; quizState.answered=false; renderQuizPanel(); }, 900);
}

/* ===== Short-answer flashcards ===== */
function renderFlashPanel(){
  const item = items.find(i=>i.id===flashState.itemId);
  const body = document.getElementById('panelBody');
  if(flashState.index >= item.qa.length){
    markItemComplete(item.id);
    body.innerHTML = `
      <div class="quiz-card" style="text-align:center;">
        <div style="font-size:15px; margin-bottom:16px;">أنهيت مراجعة كل الأسئلة القصيرة 👍</div>
        <button class="btn btn-primary" onclick="flashState={itemId:${item.id}, index:0, revealed:false}; renderFlashPanel();">إعادة المراجعة</button>
      </div>`;
    return;
  }
  const qa = item.qa[flashState.index];
  body.innerHTML = `
    <div class="quiz-progress">سؤال ${flashState.index+1} من ${item.qa.length}</div>
    <div class="flash" onclick="toggleFlash()">
      <div class="flash-label">${flashState.revealed ? 'الإجابة' : 'السؤال'}</div>
      <div class="flash-text">${flashState.revealed ? qa.a : qa.q}</div>
      <div class="flash-hint">${flashState.revealed ? 'اضغط للسؤال التالي' : 'اضغط لإظهار الإجابة'}</div>
    </div>
  `;
}
function toggleFlash(){
  if(!flashState.revealed){ flashState.revealed = true; }
  else { flashState.revealed = false; flashState.index++; }
  renderFlashPanel();
}

/* ===== Simulator ===== */
let simAnim = null;
function renderSimPanel(item){
  const body = document.getElementById('panelBody');
  if(item.sim === 'soon'){
    body.innerHTML = `<div class="sim-soon">
      <div style="font-family:'JetBrains Mono'; font-size:13px; color:var(--success); border:1px solid var(--border); padding:20px 30px; border-radius:14px;">SIM</div>
      <p>هذا المحاكي قيد الإعداد وسيتوفر قريباً.</p>
    </div>`;
    return;
  }
  // pendulum simulator
  body.innerHTML = `
    <div class="sim-wrap">
      <div class="sim-canvas-box"><canvas id="pendCanvas" width="300" height="260"></canvas></div>
      <div class="sim-controls">
        <div class="sim-row">
          <label>طول الخيط <span id="lenVal">1.0 م</span></label>
          <input type="range" id="lenSlider" min="0.3" max="2.5" step="0.1" value="1.0">
        </div>
        <div class="sim-row">
          <label>الزاوية الابتدائية <span id="angVal">30°</span></label>
          <input type="range" id="angSlider" min="5" max="60" step="1" value="30">
        </div>
        <div class="sim-readout" id="periodReadout"></div>
      </div>
    </div>
  `;
  const canvas = document.getElementById('pendCanvas');
  const ctx = canvas.getContext('2d');
  const lenSlider = document.getElementById('lenSlider');
  const angSlider = document.getElementById('angSlider');
  let L = parseFloat(lenSlider.value);
  let theta0 = parseFloat(angSlider.value) * Math.PI/180;
  let t = 0;
  const g = 9.8;
  const pivotX = 150, pivotY = 30, pxPerM = 80;

  function period(){ return 2*Math.PI*Math.sqrt(L/g); }
  function updateReadout(){
    document.getElementById('lenVal').textContent = L.toFixed(1)+' م';
    document.getElementById('angVal').textContent = Math.round(theta0*180/Math.PI)+'°';
    document.getElementById('periodReadout').textContent = 'الزمن الدوري التقريبي: T ≈ ' + period().toFixed(2) + ' ثانية';
  }
  lenSlider.oninput = ()=>{ L = parseFloat(lenSlider.value); updateReadout(); };
  angSlider.oninput = ()=>{ theta0 = parseFloat(angSlider.value)*Math.PI/180; updateReadout(); };
  updateReadout();

  if(simAnim) cancelAnimationFrame(simAnim);
  function frame(){
    t += 1/60;
    const omega = Math.sqrt(g/L);
    const theta = theta0 * Math.cos(omega * t);
    const bobX = pivotX + Math.sin(theta) * L * pxPerM;
    const bobY = pivotY + Math.cos(theta) * L * pxPerM;

    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = '#232b40'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0,pivotY); ctx.lineTo(canvas.width,pivotY); ctx.stroke();

    ctx.strokeStyle = '#5b8def'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(pivotX, pivotY); ctx.lineTo(bobX, bobY); ctx.stroke();

    ctx.fillStyle = '#5b8def';
    ctx.beginPath(); ctx.arc(pivotX, pivotY, 4, 0, 7); ctx.fill();

    ctx.fillStyle = '#f2a65a';
    ctx.beginPath(); ctx.arc(bobX, bobY, 12, 0, 7); ctx.fill();

    simAnim = requestAnimationFrame(frame);
  }
  frame();
}

/* ===== اسأل مدار ===== */
let askMadarHistory = [];
function openAskMadar(){
  const s = cur();
  if(!s.grade) return;
  document.getElementById('askMadarOverlay').classList.add('open');
  if(askMadarHistory.length === 0){
    addAskMadarMessage('bot', 'هلا! أنا "اسأل مدار" 🌟 اسألني أي شي متعلق بمنهج الصف ' + gradeLabel(s.grade) + '، وراح أجاوبك بالاعتماد على محتوى الموقع.');
  }
}
function closeAskMadar(){ document.getElementById('askMadarOverlay').classList.remove('open'); }

function addAskMadarMessage(role, text, isLoading){
  const box = document.getElementById('askMadarMessages');
  const div = document.createElement('div');
  div.className = 'ask-msg ' + role + (isLoading ? ' loading' : '');
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

async function sendAskMadar(){
  const input = document.getElementById('askMadarInput');
  const question = input.value.trim();
  if(!question) return;
  const s = cur();
  const grade = s.grade || '10';

  addAskMadarMessage('user', question);
  input.value = '';
  const loadingMsg = addAskMadarMessage('bot', 'يفكّر...', true);

  try{
    const res = await fetch('/api/ask', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ question, grade })
    });
    const data = await res.json();
    loadingMsg.remove();
    if(data.answer){
      addAskMadarMessage('bot', data.answer);
    } else {
      addAskMadarMessage('bot', data.error || 'صار خطأ، حاول مرة ثانية.');
    }
  } catch(e){
    loadingMsg.remove();
    addAskMadarMessage('bot', 'تعذّر الاتصال بالخدمة. تأكد من اتصالك بالإنترنت وحاول مرة ثانية.');
  }
}

/* ===== مؤشر التقدّم ===== */
function getProgressData(){
  try{ return JSON.parse(localStorage.getItem('madar_progress') || '{}'); }
  catch(e){ return {}; }
}
function markItemComplete(itemId){
  const data = getProgressData();
  if(data[itemId]) return;
  data[itemId] = true;
  localStorage.setItem('madar_progress', JSON.stringify(data));
}
function lessonProgressPercent(grade, lessonId){
  const data = getProgressData();
  const lessonItems = items.filter(i=>i.grade===grade && i.lesson===lessonId);
  if(lessonItems.length === 0) return 0;
  const done = lessonItems.filter(i=>data[i.id]).length;
  return Math.round((done / lessonItems.length) * 100);
}

/* ===== الوضع الليلي/النهاري ===== */
function toggleTheme(){
  const isLight = document.body.classList.toggle('light-theme');
  localStorage.setItem('madar_theme', isLight ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isLight ? '☀️' : '🌙';
}
function initTheme(){
  const saved = localStorage.getItem('madar_theme');
  if(saved === 'light'){
    document.body.classList.add('light-theme');
    document.getElementById('themeBtn').textContent = '☀️';
  }
}
initTheme();

function showAddModal(){ document.getElementById('addOverlay').classList.add('open'); }
function hideAddModal(){ document.getElementById('addOverlay').classList.remove('open'); }

function updateLessonSelect(){
  const grade = document.getElementById('newGrade').value;
  const sel = document.getElementById('newLesson');
  const units = unitsData[grade];
  if(!units){ sel.style.display = 'none'; sel.innerHTML = ''; return; }
  sel.innerHTML = units.map(u => u.lessons.map(l => `<option value="${l.id}">${u.title.split(':')[0]} — ${l.title}</option>`).join('')).join('');
  sel.style.display = 'block';
}

function addItem(){
  const grade = document.getElementById('newGrade').value;
  const cat = document.getElementById('newCat').value;
  const title = document.getElementById('newTitle').value.trim();
  const type = document.getElementById('newType').value;
  const bodyText = document.getElementById('newBody').value.trim();
  if(!title){ return; }
  const lesson = unitsData[grade] ? document.getElementById('newLesson').value : undefined;
  items.unshift({id:Date.now(), grade, cat, type, title, lesson, body: bodyText || 'لا يوجد محتوى نصي بعد.'});
  document.getElementById('newTitle').value=''; document.getElementById('newBody').value='';
  hideAddModal();
  stack = [{screen:'home'}, {screen:'categories', grade, lesson}, {screen:'list', grade, cat, lesson}];
  render();
}

render();
