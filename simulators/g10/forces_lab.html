<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مختبر القوى — الصف العاشر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Readex+Pro:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#edf1f4;--surface:#fbfcfd;--raised:#ffffff;--ink:#14223a;--muted:#56677c;--line:#d2dbe4;--grid:#e1e8ef;--chip:#e9eef3;
  --accent:#b9581a;--on-accent:#fff;--ok:#1b7a43;--ok-bg:#e1f2e7;--bad:#b8372d;--bad-bg:#f8e3e1;--warn-bg:#fff1dc;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;--f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e151f;--surface:#141e2b;--raised:#1a2636;--ink:#e4ebf3;--muted:#93a3b7;--line:#283a50;--grid:#1a2738;--chip:#1f2d3f;--accent:#f08b3f;--on-accent:#1b0e04;--ok:#52c784;--ok-bg:#16301f;--bad:#f06c61;--bad-bg:#3a1a18;--warn-bg:#3a2a12}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e151f;--surface:#141e2b;--raised:#1a2636;--ink:#e4ebf3;--muted:#93a3b7;--line:#283a50;--grid:#1a2738;--chip:#1f2d3f;--accent:#f08b3f;--on-accent:#1b0e04;--ok:#52c784;--ok-bg:#16301f;--bad:#f06c61;--bad-bg:#3a1a18;--warn-bg:#3a2a12}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
.app{max-width:1240px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.75rem;line-height:1.2;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:.95rem}
.credit{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tabs button{font:inherit;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.ctrl{display:flex;flex-direction:column;gap:16px}
.gt{font-size:.78rem;font-weight:700;color:var(--muted);margin:0 0 6px}
.seg{display:flex;flex-wrap:wrap;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;font:inherit;font-weight:600;border:0;background:transparent;color:var(--muted);padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.14)}
.field{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:4px 10px;align-items:center;margin-bottom:10px}
.field label{grid-column:1/-1;font-weight:600;font-size:.92rem}
.field input[type=range]{width:100%;accent-color:var(--accent);direction:ltr}
.field output{font:700 13px var(--f-mono);direction:ltr;text-align:center;background:var(--chip);border-radius:7px;padding:4px 2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-weight:600;border:1.5px solid var(--line);background:var(--raised);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{padding:5px 10px;font-size:.85rem}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:600}
.chk input{accent-color:var(--accent);width:18px;height:18px}
select{font:inherit;padding:7px 10px;border-radius:9px;border:1.5px solid var(--line);background:var(--raised);color:var(--ink);width:100%}
.stage{display:flex;flex-direction:column;gap:14px;min-width:0}
.board{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.board svg{display:block;width:100%;height:auto;color:var(--ink)}
svg text{font-family:var(--f-body)}
.num{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.chip{background:var(--chip);border-radius:10px;padding:9px 12px}
.chip .k{font-size:.78rem;color:var(--muted)}
.chip .v{font:700 1.1rem var(--f-mono);direction:ltr;text-align:right}
.say{margin:12px 0 0;padding:12px 14px;border-radius:10px;background:var(--warn-bg);font-weight:600}
.say.ok{background:var(--ok-bg);color:var(--ok)}
.rule{margin:12px 0 0;padding:10px 14px;border-radius:10px;border:1.5px dashed var(--accent);font-size:.92rem}
.rule b{color:var(--accent)}
.steps{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.steps li{background:var(--chip);border-radius:9px;padding:8px 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.card{border-radius:10px;padding:10px 12px;font-size:.92rem}
.card.good{background:var(--ok-bg)} .card.bad{background:var(--bad-bg)}
.card b{display:block;margin-bottom:2px}
details.talk{padding:0}
details.talk summary{cursor:pointer;font-weight:700;padding:12px 16px}
details.talk ul{margin:0;padding:0 34px 14px 16px}
details.talk li{margin:5px 0}
.q-text{font-size:1.05rem;font-weight:600;margin:0 0 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{font:inherit;font-weight:600;text-align:center;border:1.5px solid var(--line);background:var(--raised);color:var(--ink);padding:10px;border-radius:10px;cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt:disabled{cursor:default}
.why{margin:12px 0 0;padding:10px 14px;border-radius:10px;background:var(--chip)}
@media (max-width:860px){.layout{display:flex;flex-direction:column;gap:14px}.stage{display:contents}.board{order:1}.ctrl{order:2}#info{order:3}#talkBox{order:4}h1{font-size:1.45rem}}
</style></head><body>
<div class="app">
  <header>
    <div><h1>مختبر القوى</h1><p class="sub">الوحدة الرابعة: تأثيرات القوى — القوى، الاحتكاك، مقاومة الهواء، محصلة القوى، القوى المتزنة</p></div>
    <div class="credit">إعداد: أ. بدر السعيدي | 93669399 | mr.baderalsaidi</div>
  </header>
  <nav class="tabs" id="tabs" aria-label="أقسام المحاكي"></nav>
  <div class="layout">
    <aside class="panel ctrl" id="ctrl" aria-label="التحكم"></aside>
    <section class="stage">
      <div class="board"><svg id="svg" viewBox="0 0 700 360" role="img" aria-label="مشهد المحاكاة"></svg></div>
      <div class="panel" id="info"></div>
      <details class="panel talk" id="talkBox"><summary>نقاط الشرح للمعلم (اضغط للفتح)</summary><ul id="talk"></ul></details>
    </section>
  </div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const svg=$('svg'),ctrl=$('ctrl'),info=$('info'),talk=$('talk');
const reduceMotion=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const GREEN='#2e9e5b',RED='#d9483b',ORANGE='#e07b1a',BLUE='#3b7ddd',GRAY='#8a97a8';
const f1=x=>String(+x.toFixed(1)),f0=x=>String(Math.round(x));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const num=s=>`<span class="num">${s}</span>`;
function arr(x1,y1,x2,y2,col,w=5){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);if(L<3)return'';const ux=dx/L,uy=dy/L,hl=Math.min(16,L*.55),bx=x2-ux*hl,by=y2-uy*hl;
  return `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/><polygon points="${x2},${y2} ${bx-uy*hl*.55},${by+ux*hl*.55} ${bx+uy*hl*.55},${by-ux*hl*.55}" fill="${col}"/>`}
const LTR=t=>String(t).replace(/([0-9A-Za-z][0-9A-Za-z .,+-−×=/%]*[0-9A-Za-z%]|[0-9A-Za-z])/g,'⁦$1⁩');
const tx=(x,y,t,o={})=>`<text x="${x}" y="${y}" font-size="${(o.s||15)*1.28}" font-weight="${o.w||600}" fill="${o.f||'currentColor'}" text-anchor="${o.a==='start'?'end':o.a==='end'?'start':'middle'}">${LTR(t)}</text>`; // the page is RTL: SVG start/end are mirrored, so swap them (a:'start' = text extends to the right of x)
const carSvg=(x,y,sc=1,col='#4e86d6')=>`<g transform="translate(${x} ${y}) scale(${sc})"><path d="M-62 0 L-62 -22 Q-60 -30 -48 -31 L-30 -31 L-18 -50 Q-14 -54 -6 -54 L28 -54 Q36 -54 40 -48 L52 -31 L60 -29 Q66 -26 66 -18 L66 0 Z" fill="${col}" stroke="#1a1a1a" stroke-width="2.4"/><path d="M-14 -31 L-4 -48 L24 -48 L36 -31 Z" fill="#e8f4fb" stroke="#1a1a1a" stroke-width="1.8"/><circle cx="-34" cy="2" r="14" fill="#333"/><circle cx="-34" cy="2" r="6" fill="#bbb"/><circle cx="38" cy="2" r="14" fill="#333"/><circle cx="38" cy="2" r="6" fill="#bbb"/></g>`;
const groundMarks=(off,y,col)=>{let s='';for(let x=-((off%80)+80)%80-80;x<780;x+=80)s+=`<line x1="${x}" y1="${y}" x2="${x+38}" y2="${y}" stroke="${col}" stroke-width="4"/>`;return s};

/* ---------- UI helpers ---------- */
function slider(id,label,min,max,step,val,unit){return `<div class="field"><label for="${id}">${label}</label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><output id="${id}_o">${val} ${unit}</output></div>`}
function bindSlider(id,unit,fn){const el=$(id),o=$(id+'_o');const upd=()=>{o.textContent=el.value+' '+unit;fn(parseFloat(el.value))};el.addEventListener('input',upd);return {set(v){el.value=v;o.textContent=el.value+' '+unit}}}
function seg(id,items,cur){return `<div class="seg" id="${id}" role="group">${items.map(([k,t])=>`<button data-k="${k}" aria-pressed="${k===cur}">${t}</button>`).join('')}</div>`}
function bindSeg(id,fn){const el=$(id);el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));fn(b.dataset.k)})}

/* ---------- engine: one active tab at a time ---------- */
let tick=null,raf=0,lastT=0,curTab='what';
function loop(t){const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;if(tick)tick(dt);raf=requestAnimationFrame(loop)}
function startLoop(){cancelAnimationFrame(raf);lastT=performance.now();raf=requestAnimationFrame(loop)}
function setTalk(list){talk.innerHTML=list.map(t=>`<li>${t}</li>`).join('')}

const TABS=[['what','ما القوة؟'],['fric','الاحتكاك'],['air','مقاومة الهواء'],['net','محصلة القوى'],['bal','القوى المتزنة'],['quiz','اختبر نفسك']];
$('tabs').innerHTML=TABS.map(([k,t])=>`<button data-k="${k}" aria-pressed="${k===curTab}">${t}</button>`).join('');
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;openTab(b.dataset.k)});
function openTab(k){curTab=k;tick=null;$('tabs').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.k===k));({what:tabWhat,fric:tabFric,air:tabAir,net:tabNet,bal:tabBal,quiz:tabQuiz})[k]();startLoop()}

/* =====================================================================
   1) ما القوة؟ — ثلاثة تأثيرات: السرعة، الاتجاه، الشكل
   ===================================================================== */
function tabWhat(){
  const W={mode:'speed',F:0,v:0,x:0,hist:[],th:0,px:0,py:0,vx:0,vy:0,S:0,trail:[],mat:'elastic',kind:'stretch',P:0,def:0,applied:false,dmax:0};
  ctrl.innerHTML=`<div><p class="gt">اختر تأثير القوة</p>${seg('mode',[['speed','تغيير السرعة'],['dir','تغيير الاتجاه'],['shape','تغيير الشكل']],'speed')}</div><div id="mctrl"></div>`;
  setTalk(['القوة دفع أو شدّ، ووحدتها النيوتن (N)، ونرسمها بسهم يدل اتجاهه على اتجاه القوة وطوله على مقدارها.','للقوة ثلاثة تأثيرات: تغيّر سرعة الجسم، وتغيّر اتجاه حركته، وتغيّر شكله وحجمه.','ابدأ بتأثير السرعة: حرّك المنزلق إلى اليمين ثم اعكس القوة وانظر كيف يتباطأ الجسم.','انتقل إلى الاتجاه: قوة جانبية على جسم متحرك تجعله ينعطف دون أن تتغير سرعته.','أنهِ بالشكل: جرّب الشدّ والضغط والثني واللي، ثم أزل القوة لتفرّق بين التشوه المرن والدائم.']);
  const reset=()=>{Object.assign(W,{v:0,x:0,th:0,px:350,py:180,vx:70,vy:0,trail:[],def:0,dmax:0,applied:false})};
  reset();
  bindSeg('mode',m=>{W.mode=m;reset();modeCtrl()});
  function modeCtrl(){
    const m=$('mctrl');
    if(W.mode==='speed'){m.innerHTML=slider('F','القوة المؤثرة (موجبة نحو اليمين)',-10,10,1,W.F,'N')+`<div class="btns"><button class="btn" id="zero">القوة = 0</button><button class="btn" id="rst">إعادة من السكون</button></div>`;
      bindSlider('F','N',v=>W.F=v);$('zero').onclick=()=>{W.F=0;$('F').value=0;$('F_o').textContent='0 N'};$('rst').onclick=()=>{W.v=0;W.x=0}}
    if(W.mode==='dir'){m.innerHTML=slider('S','القوة الجانبية (موجبة نحو الأعلى)',-10,10,1,W.S,'N')+`<div class="btns"><button class="btn" id="rst">أعد الإطلاق</button></div>`;
      bindSlider('S','N',v=>W.S=v);$('rst').onclick=reset}
    if(W.mode==='shape'){m.innerHTML=`<p class="gt">نوع المادة</p>${seg('mat',[['elastic','مرنة (كرة مطاط)'],['clay','دائمة (صلصال)']],W.mat)}<p class="gt" style="margin-top:12px">نوع القوة</p>${seg('kind',[['stretch','شدّ'],['press','ضغط'],['bend','ثني'],['twist','لَيّ']],W.kind)}`+slider('P','مقدار القوة',0,100,5,W.P,'N')+`<div class="btns"><button class="btn primary" id="rel">أزِل القوة</button><button class="btn" id="rst">استعد الشكل الأصلي</button></div>`;
      bindSeg('mat',k=>{W.mat=k;W.def=0;W.dmax=0});bindSeg('kind',k=>{W.kind=k;W.def=0;W.dmax=0});
      const sl=bindSlider('P','N',v=>{W.P=v;W.applied=v>0});$('rel').onclick=()=>{W.P=0;W.applied=false;sl.set(0)};$('rst').onclick=()=>{W.def=0;W.dmax=0;W.P=0;sl.set(0)}}
    render();
  }
  function say(){
    let h='',rule='';
    if(W.mode==='speed'){const a=Math.sign(W.F),s=Math.abs(W.v)<.05?0:Math.sign(W.v);
      let t=W.F===0?(s===0?'لا توجد قوة والجسم ساكن، فيبقى ساكنًا.':'لا توجد قوة مؤثرة، فتبقى السرعة ثابتة (لا تتغير).'):s===0?'الجسم ساكن وبدأت القوة تحركه في اتجاهها.':a===s?'القوة في اتجاه الحركة: <b>تتزايد السرعة</b> (يتسارع الجسم).':'القوة عكس اتجاه الحركة: <b>تتناقص السرعة</b> (يتباطأ الجسم).';
      h=`<div class="chips"><div class="chip"><div class="k">القوة</div><div class="v">${W.F} N</div></div><div class="chip"><div class="k">السرعة</div><div class="v">${f1(W.v)} m/s</div></div></div><p class="say">${t}</p>`;rule='القوة قد <b>تغيّر سرعة الجسم</b>: تسارعه أو تباطؤه.'}
    if(W.mode==='dir'){h=`<div class="chips"><div class="chip"><div class="k">القوة الجانبية</div><div class="v">${W.S} N</div></div><div class="chip"><div class="k">مقدار السرعة</div><div class="v">${f1(Math.hypot(W.vx,W.vy)/10)} m/s</div></div></div><p class="say">${W.S===0?'لا توجد قوة جانبية: يتحرك الجسم في خط مستقيم.':'القوة الجانبية تعمل بزاوية على اتجاه الحركة: <b>يتغير اتجاه الحركة</b> فيسير الجسم في مسار منحنٍ.'}</p>`;rule='القوة قد <b>تغيّر اتجاه حركة الجسم</b> (كالسيارة التي تدور عجلة القيادة فيها).'}
    if(W.mode==='shape'){const nm={stretch:'يستطيل',press:'يتقصّر',bend:'ينثني',twist:'يلتوي'}[W.kind];
      h=`<div class="chips"><div class="chip"><div class="k">القوة الحالية</div><div class="v">${W.P} N</div></div><div class="chip"><div class="k">مقدار التشوه</div><div class="v">${f0(W.def*100)}%</div></div></div><p class="say">${W.P>0?`القوة تجعل الجسم ${nm}: القوى تغيّر <b>الشكل والحجم</b>.`:W.def>0.02?(W.mat==='elastic'?'أُزيلت القوة لكنه لم يرجع بعد…':'أُزيلت القوة ولا يزال الجسم مشوّهًا: <b>تشوه دائم</b>.'):'الجسم بشكله الأصلي.'}</p>${W.P===0&&W.dmax>0.3?`<p class="say ${W.mat==='elastic'?'ok':''}">${W.mat==='elastic'?'<b>تشوه مرن:</b> عاد الجسم إلى شكله الأصلي بعد زوال القوة (كرة القدم وكرة التنس).':'<b>تشوه دائم:</b> بقي الجسم مشوّهًا بعد زوال القوة (انثناء هيكل السيارة عند التصادم).'}</p>`:''}`;
      rule='القوى تستطيع أن <b>تشدّ الجسم أو تضغطه أو تثنيه أو تلويه</b> فتغيّر حجمه وشكله.'}
    info.innerHTML=h+`<p class="rule"><b>اربط بالدرس:</b> ${rule}</p>`;
  }
  function render(){
    let s='';
    if(W.mode==='speed'){
      s+=`<rect x="0" y="262" width="700" height="14" fill="${GRAY}" opacity=".35"/>`+groundMarks(-W.x*20,300,GRAY);
      s+=carSvg(350,260,1.15,'#4e86d6');
      if(W.F)s+=arr(350+Math.sign(W.F)*60,200,350+Math.sign(W.F)*60+W.F*12,200,GREEN,6)+tx(350+Math.sign(W.F)*60+W.F*6,182,'القوة '+Math.abs(W.F)+' N',{f:GREEN});
      if(Math.abs(W.v)>.1)s+=arr(350,336,350+clamp(W.v*10,-300,300),336,BLUE,4)+tx(350,356,'السرعة '+f1(Math.abs(W.v))+' m/s',{f:BLUE,s:13});
    }
    if(W.mode==='dir'){
      s+=`<polyline points="${W.trail.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${GRAY}" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>`;
      s+=`<circle cx="${W.px}" cy="${W.py}" r="14" fill="#e8a838" stroke="#1a1a1a" stroke-width="2.4"/>`;
      const sp=Math.hypot(W.vx,W.vy)||1,ux=W.vx/sp,uy=W.vy/sp;
      s+=arr(W.px,W.py,W.px+ux*70,W.py+uy*70,BLUE,4)+tx(W.px+ux*70,W.py+uy*70-10,'السرعة',{f:BLUE,s:13});
      if(W.S){const nx=uy,ny=-ux; // left-normal of velocity (screen y down)

      if(W.kind==='press'){const L=220*(1-.4*d),h=62*(1+.4*d);body=`<rect x="${cx-L/2}" y="${cy-h/2}" width="${L}" height="${h}" rx="12" fill="#4e6a7c" stroke="#1a1a1a" stroke-width="2.4"/>`;ar=W.P?arr(cx-L/2-34-W.P*.5,cy,cx-L/2,cy,ORANGE,6)+arr(cx+L/2+34+W.P*.5,cy,cx+L/2,cy,ORANGE,6):''}

      if(W.kind==='twist'){const sl=d*40;body=`<rect x="${cx-110}" y="${cy-34}" width="220" height="68" rx="12" fill="#4e6a7c" stroke="#1a1a1a" stroke-width="2.4"/>`;for(let i=-3;i<=3;i++)body+=`<line x1="${cx+i*28-sl}" y1="${cy-34}" x2="${cx+i*28+sl}" y2="${cy+34}" stroke="#cfe0ea" stroke-width="3"/>`;ar=W.P?`<path d="M${cx+130} ${cy-40} q30 40 0 80" fill="none" stroke="${ORANGE}" stroke-width="6" stroke-linecap="round"/>${arr(cx+130,cy+37,cx+127,cy+41,ORANGE,6)}<path d="M${cx-130} ${cy+40} q-30 -40 0 -80" fill="none" stroke="${ORANGE}" stroke-width="6" stroke-linecap="round"/>${arr(cx-130,cy-37,cx-127,cy-41,ORANGE,6)}`:''}
      s+=`<line x1="120" y1="290" x2="580" y2="290" stroke="${GRAY}" stroke-width="4"/>`+body+ar;

      else{if(W.mat==='elastic')W.def+=(0-W.def)*Math.min(1,dt*5)}}

  modeCtrl();
}

  }
  tick=dt=>{const st=state();

    W.x+=W.v*dt;W.T=clamp(W.T+(W.v>0.05?st.f*W.v*.05*dt*3:-25*dt),0,100);render()};
  render();

    info.innerHTML=`<p class="q-text">${Q.cur.q.replace(/(\d+(?:\.\d+)? N)/g,'<span class="num">$1</span>')}</p><div class="opts">${Q.cur.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.replace(/(\d+(?:\.\d+)? N)/g,'<span class="num">$1</span>')}</button>`).join('')}</div><div id="why"></div>`;
    info.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(Q.done)return;Q.done=true;Q.n++;const i=+b.dataset.i,right=i===Q.cur.ans;if(right)Q.ok++;
      info.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(k===Q.cur.ans)x.classList.add('right');else if(k===i)x.classList.add('wrong')});
      $('why').innerHTML=`<p class="why"><b>${right?'إجابة صحيحة. ':'إجابة غير صحيحة. '}</b>${Q.cur.why.replace(/(\d+(?:\.\d+)? N)/g,'<span class="num">$1</span>')}</p>`;
      $('qn').textContent=Q.n;$('qk').textContent=Q.ok});
  }
  $('nq').onclick=next;$('rs').onclick=()=>{Q.n=0;Q.ok=0;$('qn').textContent=0;$('qk').textContent=0;next()};
  next();
}
openTab('what');
</script></body></html>
