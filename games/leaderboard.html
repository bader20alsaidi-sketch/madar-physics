<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>نتائج ألعاب مدار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#0a0e1a;--surface:#131a2c;--surface2:#1a2338;--line:#232b40;--ink:#edf1fa;--muted:#8c95ac;--accent:#5b8def;--warm:#f2a65a;--danger:#e8697f;--ok:#5ecf9c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",Tahoma,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}
a{color:var(--accent)}
h1{font-size:1.7rem;margin:6px 0 2px}
.sub{color:var(--muted);margin:0 0 18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.tab[aria-pressed="true"]{border-color:var(--warm);color:var(--warm);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar input{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0;flex:1;max-width:260px}
.btn{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:7px 14px;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.stat{color:var(--muted);font-size:.9rem}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:.85rem}
td.num{font-family:"JetBrains Mono",monospace}
tr:nth-child(-n+4) td:first-child{color:var(--warm);font-weight:700}
.del{font:inherit;font-size:.8rem;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:2px 10px;cursor:pointer}
.del.sure{border-color:var(--danger);color:var(--danger)}
.msg{color:var(--muted);padding:12px 0}
.msg.err{color:var(--danger)}
</style>
</head>
<body>
<div class="wrap">
  <a href="../">→ العودة إلى مدار</a>
  <h1>نتائج ألعاب مدار</h1>
  <p class="sub">ترتيب الطلاب حسب النجوم ثم النقاط. أدخل مفتاح المعلم لرؤية كل الطلاب وحذف الأسماء غير الصحيحة.</p>
  <div class="tabs" role="group" aria-label="اللعبة">
    <button class="tab" data-g="g10u1" aria-pressed="true">الصف العاشر · مغامرة الشحنات</button>
    <button class="tab" data-g="g11u1" aria-pressed="false">الصف الحادي عشر · مختبر الدقة</button>
  </div>
  <div class="panel">
    <div class="bar">
      <input id="key" type="password" placeholder="مفتاح المعلم (اختياري)" autocomplete="off" aria-label="مفتاح المعلم">
      <button class="btn" id="load">عرض النتائج</button>
      <input id="q" placeholder="بحث بالاسم" aria-label="بحث بالاسم">
      <span class="stat" id="stat"></span>
    </div>
    <div class="tbl" id="out"><p class="msg">جارٍ التحميل…</p></div>
  </div>
</div>
<script>
(function(){
  const $=s=>document.querySelector(s);
  let game='g10u1', rows=[], admin=false;
  try{ $('#key').value=localStorage.getItem('madar_admin_key')||'' }catch(e){}
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const when=t=>t?new Date(t).toLocaleString('ar-OM',{dateStyle:'short',timeStyle:'short'}):'';
  async function load(){
    const key=$('#key').value.trim();
    try{ localStorage.setItem('madar_admin_key',key) }catch(e){}
    $('#out').innerHTML='<p class="msg">جارٍ التحميل…</p>';
    try{
      const r=await fetch('/api/scores?game='+game,{headers:key?{'x-admin-key':key}:{},cache:'no-store'});
      const d=await r.json();
      if(!d.ok) throw new Error(d.error||'');
      rows=d.rows; admin=d.admin;
      $('#stat').textContent=`${d.total} طالب`+(key&&!admin?' · المفتاح غير صحيح، تظهر أول 20 فقط':'')+(!key?' · تظهر أول 20':'');
      draw();
    }catch(e){
      $('#out').innerHTML=`<p class="msg err">تعذّر تحميل النتائج${e.message==='db-not-bound'?': قاعدة البيانات غير مربوطة بعد (راجع إعداد LEADERBOARD).':'.'}</p>`;
    }
  }
  function draw(){
    const q=$('#q').value.trim();
    const list=rows.map((r,i)=>({...r,rank:i+1})).filter(r=>!q||r.name.includes(q));
    if(!list.length){$('#out').innerHTML='<p class="msg">لا توجد نتائج.</p>';return}
    $('#out').innerHTML=`<table><thead><tr><th>#</th><th>الاسم</th><th>النجوم</th><th>النقاط</th>${admin?'<th>آخر تحديث</th><th></th>':''}</tr></thead><tbody>
      ${list.map(r=>`<tr><td class="num">${r.rank}</td><td>${esc(r.name)}</td><td class="num">★ ${r.stars}</td><td class="num">${r.points}</td>
      ${admin?`<td>${when(r.updated)}</td><td><button class="del" data-pid="${esc(r.pid)}">حذف</button></td>`:''}</tr>`).join('')}</tbody></table>`;
    document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{
      if(!b.classList.contains('sure')){b.classList.add('sure');b.textContent='تأكيد الحذف';return}
      b.disabled=true;
      const r=await fetch(`/api/scores?game=${game}&pid=${encodeURIComponent(b.dataset.pid)}`,{method:'DELETE',headers:{'x-admin-key':$('#key').value.trim()}});
      const d=await r.json().catch(()=>({}));
      if(d.ok) load(); else {b.textContent='تعذّر الحذف'}
    });
  }
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',x===t?'true':'false'));
    game=t.dataset.g; load();
  });
  $('#load').onclick=load;
  $('#key').addEventListener('keydown',e=>{if(e.key==='Enter')load()});
  $('#q').oninput=draw;
  load();
})();
</script>
</body>
</html>
