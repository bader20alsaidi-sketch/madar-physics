<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مختبر الدقة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#101617; --grid:#1a2325; --surface:#182124; --surface2:#1f2a2d; --line:#2f3d40;
  --ink:#ECEFE9; --muted:#9AA9A5;
  --brass:#E3AB3F; --brass-ink:#2b1d02;
  --main:#4FD1C5; --vern:#F08A4B; --steel:#2a3639; --steel2:#34302a;
  --ok:#5ED39A; --bad:#FF7B72;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.7;margin:0;min-height:100%;
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;direction:rtl}
button{font-family:inherit;font-size:1rem;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.top b{color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-variant-numeric:tabular-nums}
.chip strong{color:var(--brass);font-family:var(--mono)}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:clamp(2.2rem,7vw,3.2rem)}
h1 span{color:var(--brass)}
h2{font-size:1.5rem}
.lead{color:var(--muted);max-width:62ch;margin:6px 0 0}
.hero{padding-block:22px 6px;display:grid;gap:6px}
.id-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.id-row label{color:var(--muted);font-size:.9rem}
.id-row input{font-family:inherit;font-size:1rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:0;flex:1;max-width:240px}
.rank{border:1px solid var(--brass);color:var(--brass);border-radius:8px;padding:2px 10px;font-size:.85rem;font-weight:700}

/* stations */
.stations{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:22px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px;align-content:start}
.st-head{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center}
.st-ico{width:52px;height:52px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center}
.st-head p{margin:0;color:var(--muted);font-size:.85rem;line-height:1.5}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 6px;color:var(--ink);display:grid;gap:2px;justify-items:center;transition:border-color .15s,transform .15s}
.lv:hover{border-color:var(--brass);transform:translateY(-2px)}
.lv .n{font-family:var(--display);font-size:1rem}
.lv .d{font-size:.75rem;color:var(--muted)}
.stars{color:var(--line);letter-spacing:1px;font-size:.95rem;white-space:nowrap}
.stars .on{color:var(--brass)}
.boss{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:start;color:var(--ink);
  background:linear-gradient(135deg,#2a2112,var(--surface) 60%);border:1.5px solid var(--brass);border-radius:16px;padding:14px}
.boss p{margin:0;color:var(--muted);font-size:.88rem}

/* play */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-block:8px 12px}
.back{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:4px 12px}
.progress{height:6px;background:var(--surface);border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--brass);transition:width .4s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.tag.ex{color:var(--brass);border-color:color-mix(in srgb,var(--brass) 45%,var(--line))}
.q{font-size:1.1rem;font-weight:700;margin:0;text-wrap:pretty}
.eq,.num{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.opts{display:grid;gap:10px}
.opt{background:var(--surface2);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:11px 14px;text-align:start;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--brass)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface2))}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ans input{font-family:var(--mono);font-size:1.2rem;width:9em;max-width:100%;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px 10px;text-align:center}
.ans input.ok{border-color:var(--ok)} .ans input.no{border-color:var(--bad)}
.unit{font-family:var(--mono);color:var(--muted)}
.check{background:var(--brass);color:var(--brass-ink);border:0;border-radius:10px;padding:8px 18px;font-weight:700}
.check:disabled{opacity:.5;cursor:default}
/* place-value boxes */
.boxes{display:grid;gap:10px;background:var(--bg);border:1px dashed var(--line);border-radius:14px;padding:12px}
.boxes .title{font-size:.85rem;color:var(--brass);font-weight:700}
.bx{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.bx label{font-size:.9rem}
.bx input{font-family:var(--mono);font-size:1.15rem;width:6.5em;background:var(--surface);color:var(--ink);border:2px solid var(--c);border-radius:10px;padding:5px 8px;text-align:center}
.bx.m{--c:var(--main)} .bx.v{--c:var(--vern)}
.bx.m label{color:var(--main)} .bx.v label{color:var(--vern)}
.hint{margin:0;color:var(--muted);font-size:.88rem}
.drow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.drow .dl{font-size:.9rem;color:var(--muted)}
.dg{display:grid;grid-template-columns:.9em 1.9em 1.9em .6em 1.9em 1.9em 2em;gap:5px;align-items:center;font-size:1.2rem}
.d{width:100%;height:2.1em;text-align:center;font:700 1em var(--mono);background:var(--surface);color:var(--ink);border:2px solid var(--c);border-radius:8px;padding:0}
.d.m{--c:var(--main)} .d.v{--c:var(--vern)} .d.t{--c:var(--brass);border-style:dashed}
.d.ok{background:color-mix(in srgb,var(--ok) 22%,var(--surface));border-color:var(--ok);border-style:solid}
.d.no{background:color-mix(in srgb,var(--bad) 20%,var(--surface));border-color:var(--bad);border-style:solid}
.fx{font:700 1.1em var(--mono);color:var(--muted);text-align:center}
.blank{display:block}
.sg{font:700 1.1em var(--mono);color:var(--vern);text-align:center}
.du{font-family:var(--mono);color:var(--muted);font-size:.7em}
.ln{grid-column:1/7;border-top:2px solid var(--muted);opacity:.7}
.builder{display:grid;gap:8px;background:var(--bg);border:1px dashed var(--line);border-radius:14px;padding:12px}
.bu{display:grid;grid-template-columns:3em 2.4em 3em 2.4em;gap:8px;align-items:center;justify-content:center;direction:ltr}
.bn{font:700 1.2rem var(--mono);color:var(--main);text-align:end}
.bv{font:700 1.1rem var(--mono);text-align:center;color:var(--vern)}
.stp{width:2.4em;height:2.4em;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:700 1.1rem var(--mono)}
.built{justify-self:center;font:700 1.6rem var(--mono);color:var(--brass);padding:4px 16px;border-radius:10px;border:2px solid transparent}
.built.ok{border-color:var(--ok)} .built.no{border-color:var(--bad)}
.preview{font-family:var(--mono);direction:ltr;text-align:center;font-size:1.05rem}
.preview .m{color:var(--main)} .preview .v{color:var(--vern)} .preview .t{color:var(--brass);font-weight:700}
.inst{direction:ltr;width:100%;max-width:520px;justify-self:center;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.inst .sl{font-family:var(--mono);font-size:11px}
.inst .cap{font-family:var(--body);font-size:10.5px;fill:var(--muted)}
table.data{border-collapse:collapse;justify-self:center;font-family:var(--mono);direction:ltr}
table.data th,table.data td{border:1px solid var(--line);padding:5px 12px;text-align:center}
table.data th{font-family:var(--body);color:var(--muted);font-weight:500;font-size:.85rem}
.tbl{overflow-x:auto;display:grid}
.feedback{border-radius:12px;padding:12px 14px;background:var(--surface2);border-inline-start:4px solid var(--ok)}
.feedback.no{border-inline-start-color:var(--bad)}
.feedback b{display:block;margin-bottom:2px}
.feedback .steps{margin-top:4px}
.next{justify-self:start;background:var(--brass);color:var(--brass-ink);border:0;border-radius:12px;padding:10px 22px;font-weight:700}
.timer{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.timer i{display:block;height:100%;background:var(--brass);transition:width 1s linear}
.timer.low i{background:var(--bad)}
.hearts{color:var(--bad);letter-spacing:3px}
.hearts .off{color:var(--line)}
.summary{text-align:center;justify-items:center;margin-top:18px}
.big{font-size:2.4rem;letter-spacing:6px;color:var(--line)} .big .on{color:var(--brass)}
.cert{border:2px solid var(--brass);border-radius:16px;padding:18px;display:grid;gap:4px;justify-items:center;text-align:center;background:linear-gradient(180deg,#241c0e,var(--surface))}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lb{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.lb-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lb-count,.lb-note{color:var(--muted);font-size:.85rem;margin:0}
.lb-note.small{font-size:.75rem}
.lb-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lb-list li{display:grid;grid-template-columns:2em 1fr auto 3.5em;gap:10px;align-items:center;padding:6px 10px;border-radius:10px;background:var(--bg);font-variant-numeric:tabular-nums}
.lb-list li:nth-child(-n+3) .rk{color:var(--brass);font-weight:700}
.lb-list li.me{outline:2px solid var(--brass)}
.lb-list .rk{text-align:center;color:var(--muted)}
.lb-list .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-list .sr{color:var(--brass)}
.lb-list .pt{text-align:end;color:var(--muted);font-size:.9rem}

.foot{margin-top:26px;color:var(--muted);font-size:.8rem;text-align:center}
@media (max-width:460px){.row2{grid-template-columns:1fr}.boss{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div class="wrap">
  <div class="top">
    <span id="brand"><a href="../../" style="color:var(--brass);text-decoration:none;font-weight:700">→ العودة إلى مدار</a> · <b>مدار الفيزياء</b> · الصف الحادي عشر · الوحدة الأولى: المهارات العملية</span>
    <span class="chips"><span class="chip">النقاط <strong id="pts">0</strong></span><span class="chip">النجوم <strong id="sts">0</strong>/39</span></span>
  </div>
  <main id="app"></main>
  <p class="foot">إعداد الأستاذ بدر السعيدي · مدار الفيزياء .. طريقك للتفوق</p>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const app=$('#app');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const f=(x,d)=>Number(x).toFixed(d);
const E=s=>`<span class="eq">${s}</span>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseNum(s){s=String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,]/g,'.').replace(/[−–]/g,'-').replace(/[^\d.\-]/g,'');return s===''||s==='.'||s==='-'?NaN:parseFloat(s)}

/* ---------- state ---------- */
const KEY='madar-g11u1';
const S={name:'',points:0,stars:{}};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v)Object.assign(S,v)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const totalStars=()=>Object.values(S.stars).reduce((a,b)=>a+b,0);
function hud(){$('#pts').textContent=S.points;$('#sts').textContent=totalStars()}
const LB={game:'g11u1',api:'/api/scores'};
/* ===== لوحة المتصدرين (تعمل على موقع مدار فقط) ===== */
function playerId(){let id=null;try{id=localStorage.getItem('madar_player_id')}catch(e){}
  if(!id){id=((window.crypto&&crypto.randomUUID)?crypto.randomUUID():('p'+Date.now()+Math.random().toString(36).slice(2))).replace(/[^A-Za-z0-9-]/g,'');try{localStorage.setItem('madar_player_id',id)}catch(e){}}return id}
let lbPending=Promise.resolve(), lbDeb=null;
function lbSubmit(){ if(!S.name||!(S.points>0)) return lbPending;
  lbPending=fetch(LB.api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game:LB.game,pid:playerId(),name:S.name,stars:totalStars(),points:S.points})}).catch(()=>{});
  return lbPending }
function lbNameChanged(){clearTimeout(lbDeb);lbDeb=setTimeout(()=>{lbSubmit().then(lbRender)},1200)}
async function lbRender(){
  const box=document.getElementById('lb'); if(!box) return;
  try{
    await lbPending;
    const r=await fetch(`${LB.api}?game=${LB.game}&pid=${encodeURIComponent(playerId())}`,{cache:'no-store'});
    const d=await r.json(); if(!d.ok) throw 0;
    const rows=d.rows||[];
    box.innerHTML=`<div class="lb-head"><h2>لوحة المتصدرين</h2><span class="lb-count">${d.total} لاعب</span></div>
      ${S.name?'':'<p class="lb-note">اكتب اسمك الثلاثي في الأعلى لتظهر في اللوحة.</p>'}
      ${rows.length?`<ol class="lb-list">${rows.map((x,i)=>`<li class="${x.me?'me':''}"><span class="rk">${i+1}</span><span class="nm">${esc(x.name)}${x.me?' (أنت)':''}</span><span class="sr">★ ${x.stars}</span><span class="pt">${x.points}</span></li>`).join('')}</ol>`:'<p class="lb-note">لا يوجد لاعبون بعد. كن الأول!</p>'}
      ${d.mine&&!rows.some(x=>x.me)?`<p class="lb-note">ترتيبك: <b>${d.mine.rank}</b> من ${d.total} · ★ ${d.mine.stars} · ${d.mine.points} نقطة</p>`:''}
      <p class="lb-note small">الترتيب حسب النجوم ثم النقاط.</p>`;
    box.hidden=false;
  }catch(e){ box.hidden=true }
}

const rankOf=n=>n>=28?'خبير معايرة':n>=12?'فني قياس':'متدرّب';
const starsHTML=(n,cls='stars')=>`<span class="${cls}" aria-label="${n} من 3">${[1,2,3].map(i=>`<span class="${i<=n?'on':''}">★</span>`).join('')}</span>`;

/* source labels */
const SRC={a1:'اختبار نهائي 2024/2025 · الدور الأول',a2:'اختبار نهائي 2024/2025 · الدور الثاني',b1:'اختبار نهائي 2023/2024 · الدور الأول',b2:'اختبار نهائي 2023/2024 · الدور الثاني',c1:'اختبار نهائي 2022/2023 · الدور الأول',c2:'اختبار نهائي 2022/2023 · الدور الثاني',x:'بنمط أسئلة الاختبارات النهائية'};

/* ================= INSTRUMENT DRAWINGS ================= */
/* r = reading in units of 0.01 cm (e.g. 234 -> 2.34 cm) */
function vernierSVG(r,reveal){
  const M=Math.floor(r/10), n=r%10, px=9.5, start=Math.max(0,M-10), X=mm=>26+(mm-start)*px;
  let s=`<rect x="12" y="24" width="336" height="60" rx="6" fill="var(--steel)"/>`;
  for(let mm=start;mm<=start+34;mm++){
    const x=X(mm), L=mm%10===0?26:mm%5===0?18:11;
    s+=`<line x1="${x}" y1="84" x2="${x}" y2="${84-L}" stroke="var(--main)" stroke-width="${mm%10===0?1.8:1}"/>`;
    if(mm%10===0) s+=`<text x="${x}" y="${84-L-5}" text-anchor="middle" class="sl" fill="var(--main)">${mm/10}</text>`;
  }
  const x0=X(M+n/10);
  s+=`<rect x="${x0-14}" y="85" width="${9*px+28}" height="42" rx="5" fill="var(--steel2)"/>`;
  for(let k=0;k<=10;k++){
    const x=x0+k*0.9*px, L=k%5===0?17:11, hi=reveal&&k===n;
    s+=`<line x1="${x}" y1="85" x2="${x}" y2="${85+L}" stroke="${hi?'var(--brass)':'var(--vern)'}" stroke-width="${hi?2.6:1}"/>`;
    if(k%5===0) s+=`<text x="${x}" y="${85+L+11}" text-anchor="middle" class="sl" fill="var(--vern)">${k}</text>`;
  }
  if(reveal){const xm=X(M+n);s+=`<line x1="${xm}" y1="58" x2="${xm}" y2="84" stroke="var(--brass)" stroke-width="2.6"/><circle cx="${xm}" cy="85" r="4" fill="var(--brass)"/>`}
  return `<svg class="inst" viewBox="0 0 360 140" role="img" aria-label="قدمة ذات ورنية">${s}
    <text x="348" y="16" text-anchor="end" class="cap">التدريج الرئيسي (cm)</text>
    <text x="348" y="136" text-anchor="end" class="cap">تدريج الورنية (10 أقسام)</text></svg>`;
}
/* r = reading in units of 0.01 mm (e.g. 288 -> 2.88 mm) */
function microSVG(r,reveal){
  const R=r/100, T=r%50, start=Math.max(0,5*Math.floor((R-2)/5)), px=34, X=mm=>30+(mm-start)*px, edge=X(R);
  let s=`<rect x="10" y="72" width="${edge-10}" height="36" fill="var(--steel)"/>
    <line x1="10" y1="90" x2="${edge}" y2="90" stroke="var(--main)" stroke-width="1.4"/>`;
  const lastHalf=Math.floor(R*2)/2;
  for(let h=start*2;h/2<=R+1e-9;h++){
    const mm=h/2, x=X(mm), whole=h%2===0, hi=reveal&&Math.abs(mm-lastHalf)<1e-9;
    s+= whole?`<line x1="${x}" y1="90" x2="${x}" y2="${mm%5===0?72:76}" stroke="${hi?'var(--brass)':'var(--main)'}" stroke-width="${hi?2.6:1.2}"/>`
             :`<line x1="${x}" y1="90" x2="${x}" y2="103" stroke="${hi?'var(--brass)':'var(--main)'}" stroke-width="${hi?2.6:1.2}"/>`;
    if(whole&&mm%5===0) s+=`<text x="${x}" y="66" text-anchor="middle" class="sl" fill="var(--main)">${mm}</text>`;
  }
  s+=`<rect x="${edge}" y="34" width="120" height="112" rx="10" fill="var(--steel2)"/>
      <line x1="${edge}" y1="34" x2="${edge}" y2="146" stroke="var(--vern)" stroke-width="1.5"/>`;
  for(let d=T-4;d<=T+4;d++){
    const y=90-(d-T)*11, dd=((d%50)+50)%50, hi=reveal&&d===T;
    s+=`<line x1="${edge}" y1="${y}" x2="${edge+(dd%5===0?20:12)}" y2="${y}" stroke="${hi?'var(--brass)':'var(--vern)'}" stroke-width="${hi?2.6:1.1}"/>`;
    if(dd%5===0) s+=`<text x="${edge+26}" y="${y+4}" class="sl" fill="var(--vern)">${dd}</text>`;
  }

/* target: PA precise+accurate, PN precise not accurate, NA accurate not precise, NN neither */
function targetSVG(kind){
  const off=kind==='PN'?68:kind==='NN'?55:0, spread=(kind==='PA'||kind==='PN')?9:50;
  const a0=Math.random()*Math.PI*2, cx=150+off*Math.cos(a0), cy=150+off*Math.sin(a0);
  let hits='';
  for(let i=0;i<5;i++){const a=a0+i*1.2566+Math.random()*.5, rr=spread*(.45+Math.random()*.55);
    hits+=`<circle cx="${cx+rr*Math.cos(a)}" cy="${cy+rr*Math.sin(a)}" r="6" fill="var(--vern)" stroke="#1a0d05" stroke-width="1.5"/>`}
  const rings=[120,92,64,36,12].map((r,i)=>`<circle cx="150" cy="150" r="${r}" fill="${i%2?'#233033':'#1a2426'}" stroke="var(--line)"/>`).join('');
  return `<svg class="inst" viewBox="0 0 300 300" style="max-width:300px" role="img" aria-label="لوحة هدف">${rings}
    <circle cx="150" cy="150" r="4" fill="var(--main)"/>${hits}</svg>`;
}

  :{kind:'num',tag:'a2',q:`مسافة ${E(f(d*10,0)+' m ± '+pd+'%')} وسرعة ${E(f(t*10,0)+' m s⁻¹ ± '+pt+'%')}. احسب النسبة المئوية لعدم اليقين في الزمن ${E('t = s / v')}.`,ans:p,tol:.051,unit:'%',
    sol:`في القسمة تُجمع النسب المئوية: ${E(`${pd}% + ${pt}% = ${p}%`)}`}};
const gPow=()=>{const a=pick([2,3,4,5]),b=pick([1,2,3]),p=2*a+b;return{kind:'num',tag:'b1',
  q:`القدرة ${E('P = V² / R')}. النسبة المئوية لعدم اليقين في ${E('V')} هي ${E(a+'%')} وفي ${E('R')} هي ${E(b+'%')}. احسب النسبة المئوية لعدم اليقين في ${E('P')}.`,ans:p,tol:.051,unit:'%',
  sol:`الأس 2 يضاعف النسبة: ${E(`2 × ${a}% + ${b}% = ${p}%`)}`}};
const gSub=()=>{const x=rnd(100,200)/10,y=rnd(30,90)/10,ux=pick([.1,.2,.3]),uy=pick([.1,.2,.3]),u=ux+uy;return{kind:'num',tag:'x',
  q:`${E('Z = X − Y')} حيث ${E(`X = (${f(x,1)} ± ${f(ux,1)})`)} و${E(`Y = (${f(y,1)} ± ${f(uy,1)})`)}. احسب عدم اليقين المطلق في ${E('Z')}.`,ans:u,tol:.001,unit:'',
  sol:`في الجمع والطرح تُجمع قيم عدم اليقين المطلق دائماً: ${E(`${f(ux,1)} + ${f(uy,1)} = ${f(u,1)}`)}`}};
const gProd=()=>{const v=100.0,uv=pick([1.0,2.0,3.0]),t=50.0,ut=pick([.3,.5,1.0]),pv=uv/v*100,pt=ut/t*100,p=pv+pt,s=v*t,a=s*p/100;return{kind:'num',tag:'c1',
  q:`سيارة سرعتها ${E(`(${f(v,1)} ± ${f(uv,1)}) m s⁻¹`)} تتحرك مدة ${E(`(${f(t,1)} ± ${f(ut,1)}) s`)}. احسب عدم اليقين المطلق في المسافة ${E('s = v × t')}.`,ans:a,tol:Math.max(5,a*.04),unit:'m',
  sol:`${E(`%v = ${f(uv,1)} ÷ ${f(v,1)} × 100 = ${f(pv,1)}%`)}، ${E(`%t = ${f(ut,1)} ÷ ${f(t,1)} × 100 = ${f(pt,1)}%`)}<br>الضرب يجمع النسب: ${E(`${f(p,1)}%`)}<br>${E(`s = ${f(s,0)} m`)}، عدم اليقين = ${E(`${f(s,0)} × ${f(p,1)}% = ${f(a,0)} m`)}`}};

/* ---- Station 4: SI units ---- */
const BASE=[['الكتلة','kg','الكيلوغرام'],['الطول','m','المتر'],['الزمن','s','الثانية'],['شدة التيار الكهربائي','A','الأمبير'],['درجة الحرارة','K','الكلفن'],['كمية المادة','mol','المول']];
const DERIVED=['القوة','السرعة','الطاقة','الضغط','التسارع','الكثافة'];
const deck=arr=>{let d=[];return()=>{if(!d.length)d=shuffle(arr);return d.pop()}};
const gSortQ=(name,base)=>({kind:'sort',tag:'b2',q:'هل هذه كمية أساسية أم مشتقة في النظام الدولي (SI)؟',item:name,
  o:['أساسية','مشتقة'],a:base?0:1,sol:base?`${name} من الكميات الأساسية في النظام الدولي.`:`${name} كمية مشتقة، تُعرَّف وحدتها من الوحدات الأساسية.`});
const gBaseName=(b)=>{const o=shuffle(BASE.filter(x=>x!==b)).slice(0,3).map(x=>`${x[2]} (${x[1]})`);return{kind:'mc',tag:'b2',
  q:`ما الوحدة الأساسية المستخدمة لقياس ${b[0]} في النظام الدولي؟`,o:[`${b[2]} (${b[1]})`,...o],a:0,sol:`${b[0]} ← ${b[2]} (${b[1]})`}};
const gTypeSym=(b)=>({kind:'text',tag:'b2',q:`اكتب رمز الوحدة الأساسية المستخدمة لقياس <b>${b[0]}</b> في النظام الدولي (بالحروف الإنجليزية).`,ans:b[1],
  sol:`${b[0]} ← ${b[2]} ورمزها ${E(b[1])}`});
const gNonBaseQ=()=>{const d=pick(DERIVED),bs=shuffle(BASE).slice(0,3).map(x=>x[0]);return{kind:'mc',tag:'x',
  q:'أي مما يلي <b>ليس</b> من الكميات الأساسية في النظام الدولي؟',o:[d,...bs],a:0,sol:`${d} كمية مشتقة، أما ${bs.join(' و')} فكميات أساسية.`}};
const NAMED=[['N','النيوتن','القوة'],['J','الجول','الطاقة'],['Pa','الباسكال','الضغط']];
const gNonBaseU=()=>{const d=pick(NAMED),bs=shuffle(BASE).slice(0,3);return{kind:'mc',tag:'x',ltr:0,
  q:'أي هذه الوحدات <b>ليست</b> وحدة أساسية في النظام الدولي؟',o:[`${d[1]} (${d[0]})`,...bs.map(x=>`${x[2]} (${x[1]})`)],a:0,
  sol:`${d[1]} (${E(d[0])}) وحدة مشتقة (وحدة ${d[2]})، أما الوحدات الأخرى فأساسية.`}};
/* build a unit from base units: exponents of kg, m, s */
const DERB=[['السرعة','v = s / t',{kg:0,m:1,s:-1}],['التسارع','a = Δv / t',{kg:0,m:1,s:-2}],['الكثافة','ρ = m / V',{kg:1,m:-3,s:0}],
  ['القوة (N)','F = m a',{kg:1,m:1,s:-2}],['الطاقة الحركية (J)','KE = ½ m v²',{kg:1,m:2,s:-2}],['الضغط (Pa)','P = F / A',{kg:1,m:-1,s:-2}]];
const SUP={'-':'⁻','1':'¹','2':'²','3':'³','4':'⁴'};
const unitStr=e=>['kg','m','s'].filter(k=>e[k]).map(k=>k+(e[k]===1?'':String(e[k]).split('').map(c=>SUP[c]).join(''))).join(' ')||'—';
const gBuild=(d)=>({kind:'build',tag:'x',q:`ابنِ وحدة <b>${d[0]}</b> من الوحدات الأساسية مستعيناً بالعلاقة ${E(d[1])}. اضبط أُس كل وحدة.`,target:d[2],
  sol:`${d[0]}: ${E(unitStr(d[2]))}`});
const EQS=[['v² = u² + 2as',1,'m² s⁻² = m² s⁻² + (m s⁻²)(m)'],['s = ut + ½at²',1,'m = (m s⁻¹)(s) + (m s⁻²)(s²) = m + m'],['v = u + at',1,'m s⁻¹ = m s⁻¹ + (m s⁻²)(s)'],['v = u + at²',0,'(m s⁻²)(s²) = m وليست m s⁻¹'],['s = v t²',0,'(m s⁻¹)(s²) = m s وليست m'],['v² = u + 2as',0,'u وحدتها m s⁻¹ بينما v² وحدتها m² s⁻²']];
const gHomog=(e)=>{e=e||pick(EQS);return{kind:'mc',tag:'x',fixed:1,q:`هل المعادلة ${E(e[0])} متجانسة من حيث الوحدات؟ (u وv سرعتان، a تسارع، s إزاحة، t زمن)`,
  o:['متجانسة','غير متجانسة'],a:e[1]?0:1,sol:`${E(e[2])}`}};

/* ================= RUNNER ================= */
let timerId=null;
function play(si,li){
  const boss=si<0, st=boss?null:STATIONS[si];
  const items=boss?bossSet():st.levels[li]();
  const pts=(li+1)*10;
  const R={i:0,correct:0,hearts:3};
  const title=boss?'امتحان المعايرة الكبير':`${st.title} · المستوى ${li+1}`;
  function render(){
    clearInterval(timerId);
    const Q=items[R.i];
    app.innerHTML=`<div class="bar"><button class="back" id="bk">→ المختبر</button><h2>${title}</h2><span class="chip">${R.i+1} / ${items.length}</span></div>
      <div class="progress"><i style="width:${R.i/items.length*100}%"></i></div>
      ${boss?`<div class="bar" style="margin-top:-4px"><span class="hearts" aria-label="المحاولات المتبقية">${[1,2,3].map(i=>`<span class="${i<=R.hearts?'':'off'}">♥</span>`).join('')}</span><span class="chip" id="tl">60</span></div><div class="timer" id="tm"><i style="width:100%"></i></div>`:''}
      <div class="card" id="card"></div>`;
    $('#bk').onclick=()=>{clearInterval(timerId);home()};
    const card=$('#card');
    let finished=false;
    const done=(ok)=>{
      if(finished)return;finished=true;clearInterval(timerId);
      if(ok){R.correct++;S.points+=boss?30:pts;save();hud()} else if(boss){R.hearts--}
      if(Q.svgR){const sv=card.querySelector('.inst');if(sv)sv.outerHTML=Q.svgR}
      const fb=document.createElement('div');fb.className='feedback'+(ok?'':' no');
      fb.innerHTML=`<b>${ok?`إجابة صحيحة! +${boss?30:pts}`:'ليست الإجابة الصحيحة'}</b><div class="steps">${Q.sol||''}</div>`;
      card.appendChild(fb);
      const nx=document.createElement('button');nx.className='next';
      const over=boss&&R.hearts<=0, last=R.i+1>=items.length;
      nx.textContent=over?'انتهت المحاولات':last?'إنهاء':'التالي ←';
      nx.onclick=()=>{ if(over) return lose(); R.i++; if(R.i>=items.length) return finish(); render(); };
      card.appendChild(nx);nx.focus({preventScroll:true});
    };
    renderQ(card,Q,done);
    if(boss){let t=60;timerId=setInterval(()=>{t--;const tl=$('#tl'),tm=$('#tm');if(!tl){clearInterval(timerId);return}
      tl.textContent=t;tm.querySelector('i').style.width=(t/60*100)+'%';tm.classList.toggle('low',t<=15);
      if(t<=0){card.querySelectorAll('button,input').forEach(x=>x.disabled=true);done(false)}},1000)}
  }
  function finish(){
    const pct=R.correct/items.length;
    const stars=boss?(R.hearts>=3?3:R.hearts===2?2:1):(pct>=.9?3:pct>=.6?2:1);
    const key=boss?'boss':st.k+li;
    S.stars[key]=Math.max(S.stars[key]||0,stars);save();hud();lbSubmit();
    app.innerHTML=`<div class="card summary">
      <h2>${boss?'اجتزت امتحان المعايرة!':'أنهيت المستوى'}</h2>${starsHTML(stars,'big')}
      <p style="margin:0;color:var(--muted)">أجبت ${R.correct} من ${items.length} إجابة صحيحة.</p>
      ${boss?`<div class="cert"><span style="color:var(--muted);font-size:.85rem">شهادة فني قياس معتمد</span><h2>${esc(S.name||'فني المختبر')}</h2><span>أتم الوحدة الأولى: المهارات العملية · ${S.points} نقطة · الرتبة: ${rankOf(totalStars())}</span><span style="color:var(--muted);font-size:.85rem">الأستاذ بدر السعيدي · مدار الفيزياء</span></div>`:''}
      <div class="btns"><button class="next" id="h">العودة للمختبر</button><button class="back" id="ag">${boss?'امتحان جديد':'أعد المستوى بأرقام جديدة'}</button>
      ${!boss&&li<2?`<button class="back" id="nl">المستوى ${li+2} ←</button>`:''}</div></div>`;
    $('#h').onclick=home;$('#ag').onclick=()=>play(si,li);
    const nl=$('#nl');if(nl)nl.onclick=()=>play(si,li+1);
  }
  function lose(){
    app.innerHTML=`<div class="card summary"><h2>انتهت المحاولات</h2><p style="margin:0;color:var(--muted)">راجع خطوات الحل وحاول مرة أخرى، ستتغير الأرقام.</p>
    <div class="btns"><button class="next" id="ag">امتحان جديد</button><button class="back" id="h">المختبر</button></div></div>`;
    $('#h').onclick=home;$('#ag').onclick=()=>play(si,li);
  }
  render();
}

/* ================= QUESTION RENDERERS ================= */
function head(Q){return `<div class="meta"><span class="tag ${Q.tag&&Q.tag!=='x'?'ex':''}">${SRC[Q.tag]||SRC.x}</span></div>`}
function renderQ(card,Q,done){
  card.innerHTML=head(Q)+`<p class="q">${Q.q}</p>`+(Q.svg||'')+(Q.html||'');
  if(Q.kind==='mc'){
    const order=Q.fixed?Q.o.map((_,i)=>i):shuffle(Q.o.map((_,i)=>i));
    card.insertAdjacentHTML('beforeend',`<div class="opts">${order.map(i=>`<button class="opt" data-i="${i}">${Q.ltr?E(Q.o[i]):Q.o[i]}</button>`).join('')}</div>`);
    card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const p=+b.dataset.i;card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.i===Q.a)x.classList.add('right')});if(p!==Q.a)b.classList.add('wrong');done(p===Q.a)});
  }
  else if(Q.kind==='sort'){
    card.insertAdjacentHTML('beforeend',`<div style="justify-self:center;font-family:var(--display);font-size:1.8rem;padding:6px 22px;border:1px dashed var(--line);border-radius:12px">${Q.item}</div>
      <div class="row2">${Q.o.map((t,i)=>`<button class="opt" data-i="${i}">${t}</button>`).join('')}</div>`);
    card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const p=+b.dataset.i;card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.i===Q.a)x.classList.add('right')});if(p!==Q.a)b.classList.add('wrong');done(p===Q.a)});
  }
  else if(Q.kind==='num'){
    card.insertAdjacentHTML('beforeend',`<div class="ans"><input id="in" inputmode="decimal" dir="ltr" autocomplete="off" aria-label="الإجابة"><span class="unit">${Q.unit}</span><button class="check" id="ck">تحقّق</button></div>`);
    const inp=$('#in'),ck=$('#ck');
    const go=()=>{const v=parseNum(inp.value);if(isNaN(v)){inp.focus();return}
      const ok=Math.abs(v-Q.ans)<=Q.tol+1e-9;inp.classList.add(ok?'ok':'no');inp.disabled=true;ck.disabled=true;
      if(!ok) Q.sol=`الإجابة الصحيحة: ${E(f(Q.ans,Q.ans%1===0?0:2)+' '+Q.unit)}<br>`+Q.sol; done(ok)};
    ck.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});inp.focus({preventScroll:true});
  }
  else if(Q.kind==='digits'){
    const COL={M:'m',V:'v',T:'t'};
    let h=`<div class="boxes"><span class="title">طريقة الخانات الرقمية</span>${Q.hint?`<p class="hint">${Q.hint}</p>`:''}`;
    Q.rows.forEach((row,ri)=>{
      if(row.line) h+=`<div class="drow"><span></span><span class="dg" dir="ltr"><span class="ln"></span></span></div>`;
      h+=`<div class="drow"><span class="dl">${row.label}</span><span class="dg" dir="ltr"><span class="sg">${row.sign||''}</span>${[...row.pat].map(ch=>
        ch==='.'?'<span class="fx">.</span>':ch==='_'?'<span class="blank"></span>':
        `<input class="d ${COL[ch]}" maxlength="1" inputmode="numeric" autocomplete="off" data-r="${ri}" aria-label="خانة رقم">`).join('')}<span class="du">${row.unit}</span></span></div>`;
    });
    card.insertAdjacentHTML('beforeend',h+`</div><div class="ans"><button class="check" id="ck">تحقّق</button></div>`);
    const ins=[...card.querySelectorAll('.d')];
    const rowVal=ri=>{const row=Q.rows[ri],box=ins.filter(x=>+x.dataset.r===ri);let k=0,any=false,str='';
      [...row.pat].forEach((ch,ci)=>{if(ci===2||ch==='.')str+='.';else if(ch==='_')str+='0';else{const v=box[k++].value;if(v)any=true;str+=v||'0'}});
      return any?parseFloat(str):NaN};
    ins.forEach((inp,k)=>{
      inp.addEventListener('input',()=>{inp.value=inp.value.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'').slice(-1);if(inp.value&&ins[k+1])ins[k+1].focus()});
      inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&ins[k-1]){ins[k-1].focus();e.preventDefault()}if(e.key==='Enter')go()});
    });
    const go=()=>{if(ins.every(x=>!x.value))return;
      let all=true;Q.rows.forEach((row,ri)=>{const v=rowVal(ri),ok=!isNaN(v)&&Math.abs(v-row.ans)<1e-6;if(!ok)all=false;
        ins.filter(x=>+x.dataset.r===ri).forEach(x=>{x.classList.add(ok?'ok':'no');x.disabled=true})});
      $('#ck').disabled=true;
      if(!all) Q.sol=`الإجابات الصحيحة: ${Q.rows.map(r=>`${r.label} ${E(f(r.ans,2)+' '+r.unit)}`).join('، ')}<br>`+Q.sol;
      done(all)};
    $('#ck').onclick=go;
    ins[0].focus({preventScroll:true});
  }
  else if(Q.kind==='text'){
    card.insertAdjacentHTML('beforeend',`<div class="ans"><input id="in" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="رمز الوحدة" style="font-family:var(--mono)"><button class="check" id="ck">تحقّق</button></div>`);
    const inp=$('#in'),ck=$('#ck');
    const go=()=>{const v=inp.value.trim();if(!v)return;const ok=v.toLowerCase()===Q.ans.toLowerCase();
      inp.classList.add(ok?'ok':'no');inp.disabled=ck.disabled=true;if(!ok)Q.sol=`الإجابة الصحيحة: ${E(Q.ans)}<br>`+Q.sol;done(ok)};
    ck.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});inp.focus({preventScroll:true});
  }
  else if(Q.kind==='build'){
    const ex={kg:0,m:0,s:0};
    card.insertAdjacentHTML('beforeend',`<div class="builder">${['kg','m','s'].map(k=>`<div class="bu"><span class="bn">${k}</span>
      <button class="stp" data-k="${k}" data-d="-1" aria-label="إنقاص أُس ${k}">−</button><span class="bv" id="bv-${k}">0</span><button class="stp" data-k="${k}" data-d="1" aria-label="زيادة أُس ${k}">+</button></div>`).join('')}
      <div class="built" dir="ltr" id="built">—</div></div><div class="ans"><button class="check" id="ck">تحقّق</button></div>`);
    const draw=()=>{['kg','m','s'].forEach(k=>$('#bv-'+k).textContent=ex[k]>0?'+'+ex[k]:ex[k]);$('#built').textContent=unitStr(ex)};
    card.querySelectorAll('.stp').forEach(b=>b.onclick=()=>{const k=b.dataset.k;ex[k]=Math.max(-3,Math.min(3,ex[k]+(+b.dataset.d)));draw()});
    $('#ck').onclick=()=>{const ok=['kg','m','s'].every(k=>ex[k]===Q.target[k]);card.querySelectorAll('.stp').forEach(x=>x.disabled=true);$('#ck').disabled=true;
      $('#built').classList.add(ok?'ok':'no');done(ok)};
  }
}

home();
})();
</script>

</html>
